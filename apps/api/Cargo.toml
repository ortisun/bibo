[package]
name = "factory-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The API is a composition root (ring 3, ADR 0002): the binary that receives GitHub webhooks,
# accepts jobs and decisions from people, and answers status and timeline queries. It chooses its
# adapters through the composition library (ADR 0015) and depends on the WebhookVerifier port, not
# on the github crate. It uses the API database login only (ADR 0012).

[lib]
name = "factory_api"
path = "src/lib.rs"

[[bin]]
name = "factory-api"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
factory-composition.workspace = true
factory-domain.workspace = true
factory-ports.workspace = true
factory-workflow.workspace = true
factory-observability.workspace = true

serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "signal"] }
uuid = { version = "1.29.0", default-features = false, features = ["std"] }

# NEW DIRECT DEPENDENCIES, PENDING CONFIRMATION BY A PERSON (policies/security.yaml,
# supply_chain.new_direct_dependency). The master prompt and the architecture overview name Axum on
# Tokio for the API. All pass `cargo deny` as it is; see the README of this package, section
# "Dependencies", for versions, licences and what each one is for. They are used behind two small
# modules (`server` and `routes`), so a replacement touches those only.
#
# `axum` routes by method and path and extracts the request. Only `http1` and `tokio` are on:
# no JSON extractor (the API reads the raw body and decodes it itself, so an error answer never
# carries a library message), no form, no query, no websocket, no HTTP/2.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
# `hyper` and `hyper-util` serve the connections so that a header read timeout, a limit on open
# connections and the peer address are under the API's control (`axum::serve` offers none of them).
hyper = { version = "1.12.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["server", "http1", "tokio", "service"] }
# The request body reader with a hard size limit.
http-body-util = "0.1.5"
# `tower::Service` is the interface between the router and hyper-util.
tower = { version = "0.5.3", default-features = false, features = ["util"] }

[dev-dependencies]
factory-testkit.workspace = true
factory-storage.workspace = true
# The complete run (`tests/complete_run.rs`) builds the worker's side of the system around the
# real server: the engine's stage handlers, the agent registry and the output schemas.
factory-contracts.workspace = true
factory-sandbox.workspace = true
# The live-adapters run (`tests/live_run.rs`) builds the real model broker and its listener, and the
# agent tools' runtime adapters and skill bundle, around the real pipeline. Dev only; an app may
# depend on any library crate (DEP-01).
factory-egress.workspace = true
factory-runtime.workspace = true
factory-github.workspace = true
async-trait = "0.1.92"
# The database test server of the storage crate is included with `#[path]` and needs these.
diesel = { version = "2.3.14", default-features = false, features = ["postgres_backend"] }
diesel-async = { version = "0.9.2", default-features = false, features = ["postgres", "deadpool"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "signal", "test-util", "io-util"] }
