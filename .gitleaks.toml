# .gitleaks.toml - secret scan rules for the whole git history (ST-08), used by `gitleaks git`
# through the `secret-scan` step of scripts/ci.sh. gitleaks finds this file by itself in the
# directory it scans. scripts/ci.sh clears every GITLEAKS_* variable first, so the environment
# cannot swap this file for another.
#
# Owner: work package s0-security-baseline (security specialist). This file is a protected path
# (policies/security.yaml group gate_and_toolchain_config, and .github/CODEOWNERS). A pull request
# that edits it needs the owner's review, so a builder cannot weaken the scan to hide a secret
# (threat T-12). Threats answered: T-16 to T-20 (secret exposure).
#
# WHAT IS HERE. The tool's own default rules stay on (`useDefault` below). On top of them, one rule
# per entry of policies/security.yaml secrets.patterns whose action is `block`, with the rule id
# `policy_` plus the pattern id and the regex copied unchanged from the policy. The policy file is
# the source of truth. If the two disagree, the policy wins and this file is the defect. When a
# pattern in the policy changes, change the matching rule here in the same pull request.
#
# WHAT IS NOT HERE, ON PURPOSE.
#   * Pattern `generic_assignment` and the entropy heuristic. The policy gives them the action
#     `flag` ("blocking on entropy alone causes false positives"). gitleaks has no flag level: a
#     finding always fails the scan. They are left to the tool's default `generic-api-key` rule,
#     which does use entropy, and to the review of the scan result.
#   * The `exact_values` registry. It holds runtime secrets that the factory issued itself, and the
#     factory applies it at its output sinks, not by a scan of the repository.
#
# WHY THE `policy_` PREFIX. When a config extends the defaults, a rule with the same id as a default
# rule is MERGED with it field by field. The policy pattern `jwt` has the same id as gitleaks' own
# `jwt` rule, and the default's entropy filter stayed switched on for our regex (verified: a plain
# `jwt` rule missed a low-entropy sample). A prefixed id never merges with a default rule.
#
# REGEX DIALECT. The policy writes its regexes for the Rust `regex` crate. gitleaks uses Go's
# regexp, which is also RE2. Both accept every construct used here (\b, (?i), (?:...), counted
# repeats, character classes). Each rule was run in gitleaks 8.30.1 against a made-up sample that it
# must find and a near miss that it must not find.
#
# A TYPO DOES NOTHING. gitleaks silently ignores a key it does not know (verified: an invented
# top-level key loads without a message), and it does not enforce `minVersion` (verified: v9.0.0 is
# accepted by 8.30.1). So a misspelled key weakens the scan without any error. That is why the
# rules and the exceptions below were each tested for their effect and not only for loading. The
# version in use is PIN_GITLEAKS in scripts/ci.sh.
#
# EXCEPTIONS. scripts/ci.sh passes --ignore-gitleaks-allow, so an inline `gitleaks:allow` comment
# cannot hide a finding. Two exceptions exist today, both below, each limited to one or two files
# AND to exact made-up values, each with a reason and a "review by" date. An exception needs a
# human decision (policies/approval.yaml, always_human). Any other exception goes into a rule's
# `[[rules.allowlists]]` here, or into .gitleaksignore by fingerprint (also a protected path).
#
# NO SECRET IS STORED HERE. The file holds only patterns and the made-up values named in the two
# exceptions. Samples used to test the rules were built at run time and kept outside the repository.

title = "Ortisun software factory secret scan"

[extend]
# Keep gitleaks' own detectors (cloud providers, generic API keys, and many more) and add ours.
useDefault = true

[[rules]]
id = "policy_github_token_classic"
description = "policies/security.yaml secrets.patterns[github_token_classic], action block."
regex = '''\bghp_[A-Za-z0-9]{36}\b'''
keywords = ["ghp_"]

[[rules]]
id = "policy_github_token_prefixed"
description = "policies/security.yaml secrets.patterns[github_token_prefixed], action block."
regex = '''\bgh[ousr]_[A-Za-z0-9]{36,255}\b'''
keywords = ["gho_", "ghu_", "ghs_", "ghr_"]

[[rules]]
id = "policy_github_fine_grained"
description = "policies/security.yaml secrets.patterns[github_fine_grained], action block."
regex = '''\bgithub_pat_[A-Za-z0-9_]{22,255}\b'''
keywords = ["github_pat_"]

[[rules]]
id = "policy_private_key_block"
description = "policies/security.yaml secrets.patterns[private_key_block], action block."
regex = '''-----BEGIN (?:[A-Z0-9]+ )?PRIVATE KEY(?: BLOCK)?-----'''
keywords = ["-----begin"]

[[rules]]
id = "policy_anthropic_api_key"
description = "policies/security.yaml secrets.patterns[anthropic_api_key], action block."
regex = '''\bsk-ant-[A-Za-z0-9_-]{20,}\b'''
keywords = ["sk-ant-"]

[[rules]]
id = "policy_openai_api_key"
description = "policies/security.yaml secrets.patterns[openai_api_key], action block."
regex = '''\bsk-(?:proj-|svcacct-|admin-)?[A-Za-z0-9_-]{32,}\b'''
keywords = ["sk-"]

[[rules]]
id = "policy_aws_access_key_id"
description = "policies/security.yaml secrets.patterns[aws_access_key_id], action block."
regex = '''\b(?:AKIA|ASIA|AGPA|AIDA|AROA|ANPA|ANVA)[A-Z0-9]{16}\b'''
keywords = ["akia", "asia", "agpa", "aida", "aroa", "anpa", "anva"]

[[rules]]
id = "policy_aws_secret_access_key"
description = "policies/security.yaml secrets.patterns[aws_secret_access_key], action block."
regex = '''(?i)aws_?secret_?access_?key["'\s:=]+[A-Za-z0-9/+=]{40}'''
keywords = ["aws"]

[[rules]]
id = "policy_gcp_api_key"
description = "policies/security.yaml secrets.patterns[gcp_api_key], action block."
regex = '''\bAIza[0-9A-Za-z_-]{35}\b'''
keywords = ["aiza"]

[[rules]]
id = "policy_slack_token"
description = "policies/security.yaml secrets.patterns[slack_token], action block."
regex = '''\bxox[abprs]-[A-Za-z0-9-]{10,}\b'''
keywords = ["xox"]

[[rules]]
id = "policy_stripe_live_key"
description = "policies/security.yaml secrets.patterns[stripe_live_key], action block."
regex = '''\b[rs]k_live_[0-9A-Za-z]{20,}\b'''
keywords = ["_live_"]

[[rules]]
id = "policy_npm_token"
description = "policies/security.yaml secrets.patterns[npm_token], action block."
regex = '''\bnpm_[A-Za-z0-9]{36}\b'''
keywords = ["npm_"]

[[rules]]
id = "policy_pypi_token"
description = "policies/security.yaml secrets.patterns[pypi_token], action block."
regex = '''\bpypi-AgE[A-Za-z0-9_-]{50,}\b'''
keywords = ["pypi-age"]

[[rules]]
id = "policy_crates_io_token"
description = "policies/security.yaml secrets.patterns[crates_io_token], action block. The policy marks this format as unverified."
regex = '''\bcio[A-Za-z0-9]{32}\b'''
keywords = ["cio"]

[[rules]]
id = "policy_jwt"
description = "policies/security.yaml secrets.patterns[jwt], action block."
regex = '''\beyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\b'''
keywords = ["eyj"]

[[rules]]
id = "policy_authorization_header"
description = "policies/security.yaml secrets.patterns[authorization_header], action block."
regex = '''(?i)\bauthorization:\s*(?:bearer|token|basic)\s+[A-Za-z0-9._~+/=-]{16,}'''
keywords = ["authorization"]

[[rules]]
id = "policy_url_with_credentials"
description = "policies/security.yaml secrets.patterns[url_with_credentials], action block."
regex = '''\b[a-z][a-z0-9+.-]*://[^\s:/@]+:[^\s@/]{3,}@[^\s/]+'''
keywords = ["://"]

# EXCEPTION 1 (review by 2027-01-31). These made-up URLs are test inputs and a doc comment in the
# observability crate's scrubber and endpoint checks. They exist to prove that a URL with a
# password is refused or redacted. None is a real credential: the passwords are the words
# "secret" and "password", the placeholder "{secret}" and "hunter2hunter2", and the host is the
# reserved name collector.example. The exception needs BOTH the file path AND the exact text, so a
# different credential in the same file, or the same text anywhere else, is still found.
[[rules.allowlists]]
description = "Made-up URLs in crates/observability tests and the scrubber's doc comment"
condition = "AND"
paths = ['''^crates/observability/(?:tests/init|src/redact)\.rs$''']
regexTarget = "match"
regexes = [
    '''http://user:secret@collector\.example''',
    '''http://user:\{secret\}@collector\.example''',
    '''scheme://user:password@host''',
]

[[rules]]
id = "policy_factory_job_token"
description = "policies/security.yaml secrets.patterns[factory_job_token], action block."
regex = '''\bsfjt_[A-Za-z0-9_-]{32,}\b'''
keywords = ["sfjt_"]

[[rules]]
id = "policy_nats_credentials"
description = "policies/security.yaml secrets.patterns[nats_credentials], action block. The policy marks this format as unverified."
regex = '''-----BEGIN (?:NATS )?USER (?:JWT|NKEY SEED)-----'''
keywords = ["-----begin"]

# EXCEPTION 2 (review by 2027-01-31). The scrubber test builds a fake NATS key header around forty
# repeated letters to prove that the header is redacted. The header alone is public text and the
# body is not a key. The exception needs BOTH the file path AND the exact header.
[[rules.allowlists]]
description = "Made-up NATS key header in the scrubber test"
condition = "AND"
paths = ['''^crates/observability/tests/redaction\.rs$''']
regexTarget = "match"
regexes = ['''-----BEGIN NATS USER NKEY SEED-----''']

# Made-up canaries in test code, found by the full-history scan on 2026-10-27 (118 commits).
# They are the AWS documentation example key and a token with an obvious pattern, used to check
# that redaction and leak sweeps work. Neither is a credential. The allowlist is global because one
# of the three findings comes from a default gitleaks rule, which a per-rule block cannot reach.
# It needs BOTH the file path and the exact text, so a different token in the same file, or the
# same text anywhere else, is still reported. Review by 2027-01-31, or remove it once these tests
# build their canaries at run time.
[[allowlists]]
description = "Made-up canaries in the schema engine tests and the testkit contract suites"
condition = "AND"
targetRules = ["policy_aws_access_key_id", "policy_github_token_prefixed", "github-app-token"]
paths = ['''^crates/(?:contracts/src/schema_engine|testkit/src/contracts/(?:githost|workspace))\.rs$''']
regexTarget = "match"
regexes = [
    '''AKIAIOSFODNN7EXAMPLE''',
    '''ghs_a1B2c3D4e5a1B2c3D4e5a1B2c3D4e5a1B2c3''',
]
