# The full local run of the software factory (work package s1-local-deployment).
#
# This file is separate from docker-compose.yml, which is the small "PostgreSQL only" development
# stack of scripts/dev-up.sh. Use this one when you want the database, the artifact volume and,
# once their programs exist, the factory services, laid out the way docs/security/sandbox-policy.md
# asks for. The two stacks use different project names and different volumes, so they never touch
# each other's data.
#
# HOW TO START IT
#   scripts/local-up.sh              the "local" profile: PostgreSQL 18 and the artifact volume
#   scripts/local-up.sh --factory    also the "factory" profile (only once you have built the two images)
#   scripts/smoke.sh                 starts a throwaway copy with the "test" profile and checks it
#   Every setting comes from the environment (see the list below). Nothing is read from a file
#   that is committed, and no secret is in this file.
#
# PROFILES (a service with no profile would start in every case, so every service names its own)
#   local    what a person runs for development: fixed loopback port, restarts after a reboot.
#   test     what scripts/smoke.sh and scripts/restore-drill.sh run: a random-looking project name,
#            a loopback port chosen by the script, no restart, every object labelled
#            factory.test=true. Adds "sandbox-probe", a container that behaves like a sandbox so
#            the smoke script can prove it has no route to PostgreSQL.
#   factory  the factory's own services, "api" and "worker". The programs exist (apps/api serves HTTP; apps/worker
#            runs its start-up checks and, until the credentials are supplied, exits with code 3, BLOCKED), but
#            no Dockerfile for either is in the repository, so nobody has built the two images and this profile
#            has never been started. The contract (image names, configuration files, secret files, the user) is
#            in docs/operations/local-deployment.md, section "Contract for the factory services".
#
# NETWORK LAYOUT (docs/security/sandbox-policy.md section 5)
#   data       PostgreSQL, api, worker. The only network PostgreSQL is on. Sandbox containers and
#              egress sidecars are never attached to it.
#   broker     internal, so it has no route out. The worker (which hosts the model broker) and the
#              per-job egress sidecars that the worker's supervisor starts. The sidecars also join
#              their own per-job "--internal" network, which the supervisor creates at run time.
#   probe_net  internal. Test profile only. Stands in for a per-job sandbox network.
#   A sandbox therefore reaches the sidecar and nothing else. It has no address on "data", and an
#   internal network has no route to this machine, so it cannot reach the published database
#   port either. scripts/smoke.sh tests all of this with the real agent sandbox image.
#
# SETTINGS (environment variables, all optional unless marked)
#   FACTORY_SECRETS_DIR   REQUIRED. A folder holding the secret files named under "secrets:" below.
#                         scripts/local-up.sh creates it (mode 0700, files 0600).
#   FACTORY_UID, FACTORY_GID   The user the api and the worker run as, and the owner of the artifact volume.
#                         Default 10010:10010. Compose mounts a file secret with the owner and mode of the host
#                         file, and the services refuse a secret that group or others can read, so on a Linux
#                         host the container user has to be the user that owns the files: set these to
#                         `id -u` and `id -g` of the person who ran scripts/local-up.sh. Set them the same way
#                         for every script (backup, restore). See docs/operations/local-deployment.md.
#   FACTORY_ALLOWLIST_DIR A folder that holds allowlist.yaml, the named people and their designations. Mounted
#                         read-only into the api and the worker. Default ./allowlist next to this file
#                         (ignored by Git). Without the file every request that needs a designation is refused.
#   FACTORY_PG_PORT       Loopback port for PostgreSQL. Default 55432.
#   FACTORY_API_PORT      Loopback port for the API (factory profile). Default 8080.
#   FACTORY_PG_IMAGE      Override the PostgreSQL image. Keep it pinned by digest.
#   FACTORY_TEST          "true" in the test profile. Becomes the label factory.test.
#   FACTORY_RUN_ID        Names one run. Becomes the label factory.run.
#   FACTORY_RESTART       Restart policy. Default unless-stopped; the test profile sets "no".
#   FACTORY_API_IMAGE, FACTORY_WORKER_IMAGE            images of the factory profile
#   FACTORY_SANDBOX_AGENT_IMAGE, FACTORY_SANDBOX_VERIFY_IMAGE, FACTORY_SANDBOX_SIDECAR_IMAGE
#                         images the worker starts as sandboxes, by digest, from
#                         infra/sandbox-images/images.json
#   FACTORY_WORKER_DOCKER_HOST   how the worker reaches Docker. See the note at the worker service.
#   FACTORY_SANDBOX_PROBE_IMAGE  image of the probe (test profile). scripts/smoke.sh sets it to the
#                         agent sandbox image.

name: factory-local

# ---- Pieces shared by several services ------------------------------------------------------

# Labels on every object this file creates. factory.test=true is how a test run is told apart from
# a person's stack, and factory.run names the one run, so a cleanup can remove exactly what that
# run made and nothing else.
x-labels: &labels
  factory.managed: "true"
  factory.test: "${FACTORY_TEST:-false}"
  factory.run: "${FACTORY_RUN_ID:-local}"

# The hardening every container gets (the same stance as docs/security/sandbox-policy.md section 3).
# A service adds back only what it proves it needs.
x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  init: true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

# The user the factory services and the artifact volume use. A number, not a name, so it means the
# same thing in every image. 10001 to 10003 are taken by the sandbox images. It is 10010:10010 unless
# FACTORY_UID and FACTORY_GID say otherwise (see the settings above for why a Linux host may need that).
x-factory-user: &factory-user "${FACTORY_UID:-10010}:${FACTORY_GID:-10010}"

# The PostgreSQL image: 18.6 on Debian, pinned by the digest of its multi-platform index, as ADR 0007
# (revised by ADR 0012) requires. It is the image the database tests ran on (docs/database/running.md).
# To move to a newer 18.x: run "docker buildx imagetools inspect postgres:18", copy the top-level
# Digest, change this line, run scripts/restore-drill.sh, and review the change like any dependency
# update. A major version change is a dump and restore, not an image swap (docs/operations/troubleshooting.md).
x-postgres-image: &postgres-image ${FACTORY_PG_IMAGE:-postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6}

services:
  # ---- PostgreSQL ---------------------------------------------------------------------------
  postgres:
    image: *postgres-image
    <<: *hardened
    profiles: [local, test]
    restart: ${FACTORY_RESTART:-unless-stopped}
    labels: *labels
    environment:
      # The image creates this superuser and this database on the first start only. The password is
      # read from a file, never from the environment (docs/security/secrets-and-credentials.md).
      POSTGRES_USER: factory_admin
      POSTGRES_DB: factory
      POSTGRES_PASSWORD_FILE: ${FACTORY_RUN_SECRETS_DIR:-/run/secrets}/pg_superuser_password
    secrets:
      - pg_superuser_password
    # Bound to the loopback address only. Without the "127.0.0.1:" prefix Docker would publish the
    # port on every network interface of this machine.
    ports:
      - "127.0.0.1:${FACTORY_PG_PORT:-55432}:5432"
    volumes:
      # The PostgreSQL 18 image keeps its data in a versioned folder below /var/lib/postgresql
      # (PGDATA is /var/lib/postgresql/18/docker). Mounting the parent is what the image documents.
      # Mounting the old /var/lib/postgresql/data path would leave the data in an anonymous volume.
      - pgdata:/var/lib/postgresql
    networks: [data]
    healthcheck:
      # Over TCP on 127.0.0.1, not the socket: during first-time setup the image runs a temporary
      # server that listens only on the socket, and a socket check would say "healthy" too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U factory_admin -d factory"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    # The image starts as root only to fix the ownership of the data folder, then drops to the
    # "postgres" user. These four capabilities are what that first step needs.
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    tmpfs:
      - /tmp
      - /run/postgresql
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    # Time to flush and shut down cleanly. The image stops on SIGINT (PostgreSQL's fast shutdown).
    stop_grace_period: 30s

  # ---- The artifact volume --------------------------------------------------------------------
  # A one-shot job that gives the volume the owner and mode the storage crate expects. The crate
  # (crates/storage/src/artifact_fs) creates its directories as 0700 and its blobs as 0400, and it
  # opens the root with no way to fix permissions, so the root must already belong to the factory user
  # (FACTORY_UID:FACTORY_GID, 10010:10010 by default) and be closed to everyone else. The job changes only
  # the top folder, never the blobs inside, so it is safe to run on a volume that already holds data. It
  # has no network at all.
  artifacts-init:
    image: *postgres-image
    profiles: [local, test, factory]
    restart: "no"
    labels: *labels
    network_mode: none
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["install -d -m 0700 -o ${FACTORY_UID:-10010} -g ${FACTORY_GID:-10010} /artifacts && chown ${FACTORY_UID:-10010}:${FACTORY_GID:-10010} /artifacts && chmod 0700 /artifacts"]
    volumes:
      - artifacts:/artifacts
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    mem_limit: 64m
    pids_limit: 32

  # ---- The sandbox probe (test profile only) --------------------------------------------------
  # The real agent sandbox image, run the way the sandbox policy runs it (non-root, no
  # capabilities, read-only root, no new privileges) on a network that stands in for a per-job
  # network. scripts/smoke.sh runs connection attempts from inside it and requires every one to fail.
  sandbox-probe:
    image: ${FACTORY_SANDBOX_PROBE_IMAGE:-factory-sandbox/agent:unset}
    # The name belongs to this project's own build. Never pull a stranger's image by that name.
    pull_policy: never
    <<: *hardened
    profiles: [test]
    restart: "no"
    labels: *labels
    user: "10001:10001"
    entrypoint: ["/bin/bash", "-c"]
    command: ["while true; do sleep 3600; done"]
    networks: [probe_net]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  # ---- The factory services (profile "factory": needs two images that nobody has built yet) ----
  # State on 2026-10-29: apps/api is a working HTTP server (docs/reference/commands.md, "The API server"). apps/worker
  # runs its start-up checks and exits with code 3 (BLOCKED) until a deployment supplies the model provider, the
  # GitHub App and the tenants. No Dockerfile for either is in the repository, so there is no image to run, and
  # nothing in this profile has been started. The files below are what the programs read, taken from the code.
  #
  # How they are configured: ONE YAML file named by FACTORY_CONFIG (the examples in config/ are parsed by the
  # programs' own tests), an environment that can only tighten it (FACTORY_PROFILE, FACTORY_LOG), and every secret
  # a path to a file. The contract is in docs/operations/local-deployment.md, "Contract for the factory services".
  #
  # The decision signing key (secret "decision_signing_key") is mounted in BOTH services, at the same path. The API
  # signs each decision request with it and the worker verifies the signature before it reads the record; a worker
  # that holds another value rejects every request as unsigned. scripts/smoke.sh --static fails when only one of the
  # two lists it.
  api:
    image: ${FACTORY_API_IMAGE:-factory-api:local}
    # Built on this machine, never pulled.
    pull_policy: never
    <<: *hardened
    profiles: [factory]
    restart: on-failure:5
    labels: *labels
    user: *factory-user
    environment:
      FACTORY_CONFIG: /etc/factory/api.yaml
      FACTORY_PROFILE: local
    secrets:
      - source: pg_url_api
        target: db_api
      - decision_signing_key
      - webhook_secret
    ports:
      - "127.0.0.1:${FACTORY_API_PORT:-8080}:8080"
    volumes:
      - ${FACTORY_API_CONFIG:-./config/api.local.example.yaml}:/etc/factory/api.yaml:ro
      - artifacts:/var/lib/factory/artifacts
      # The protected checkout the API reads (protected_checkout in its configuration): the policies, and the
      # allowlist file that gives a person a designation. Read-only; the repository root is not mounted.
      - ../../policies:/etc/factory/protected/policies:ro
      - ${FACTORY_ALLOWLIST_DIR:-./allowlist}:/etc/factory/protected/allowlist:ro
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy
      artifacts-init:
        condition: service_completed_successfully
    # No health check yet. The API answers GET /healthz and GET /readyz, but the image will have no shell and no
    # curl, and the binary has no subcommand that asks them, so a check has to wait for one.
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: 1
    pids_limit: 256

  worker:
    image: ${FACTORY_WORKER_IMAGE:-factory-worker:local}
    pull_policy: never
    <<: *hardened
    profiles: [factory]
    # Exit code 3 is BLOCKED (a credential or an adapter is missing): try a few times, then stop. A worker that
    # restarts for ever on a condition that only a person can fix hides the condition.
    restart: on-failure:5
    labels: *labels
    user: *factory-user
    environment:
      FACTORY_CONFIG: /etc/factory/worker.yaml
      FACTORY_PROFILE: local
      FACTORY_LOG: ${FACTORY_LOG:-info}
      # How the worker reaches Docker to start sandboxes. This file mounts NO Docker socket: a container that can
      # talk to the Docker daemon controls the whole machine. With nothing set the worker cannot start a sandbox
      # and the job is BLOCKED, which is the fail-closed answer the sandbox policy asks for. The options are in
      # docs/operations/local-deployment.md.
      DOCKER_HOST: ${FACTORY_WORKER_DOCKER_HOST:-}
    # Two logins, two pools (ADR 0012). Each file holds the database URL for that login; the worker refuses a file
    # that group or others can read, and a URL whose login is not the one the configuration names.
    secrets:
      - source: pg_url_worker
        target: db_worker
      - source: pg_url_engine
        target: db_engine
      - decision_signing_key
    volumes:
      - ${FACTORY_WORKER_CONFIG:-./config/worker.local.example.yaml}:/etc/factory/worker.yaml:ro
      - artifacts:/var/lib/factory/artifacts
      # The protected checkout: only what the worker reads, read-only. The repository root is not mounted, because
      # it holds the secrets folder.
      - ../../policies:/srv/factory/protected/policies:ro
      - ../../agents:/srv/factory/protected/agents:ro
      - ../../profiles:/srv/factory/protected/profiles:ro
      - ../../schemas:/srv/factory/protected/schemas:ro
      - ${FACTORY_ALLOWLIST_DIR:-./allowlist}:/srv/factory/protected/allowlist:ro
      - ../sandbox-images/images.json:/srv/factory/protected/infra/sandbox-images/images.json:ro
    networks: [data, broker]
    depends_on:
      postgres:
        condition: service_healthy
      artifacts-init:
        condition: service_completed_successfully
    tmpfs:
      - /tmp
    mem_limit: 1g
    cpus: 2
    pids_limit: 512

# ---- Networks, volumes and secrets ------------------------------------------------------------

networks:
  data:
    labels: *labels
  broker:
    internal: true
    labels: *labels
  probe_net:
    internal: true
    labels: *labels

volumes:
  pgdata:
    labels: *labels
  artifacts:
    labels: *labels

# Each secret is a file. Docker mounts it read-only at /run/secrets/<target> inside the container that lists it. The
# files are created by scripts/local-up.sh with random values and mode 0600 and are never committed
# (infra/compose/secrets/.gitignore). A service gets only the secrets it lists.
#   pg_superuser_password   the bootstrap superuser; only the postgres image reads it
#   pg_url_*                the database URL of one login, in the form the worker's configuration wants (url_file)
#   decision_signing_key    32 random bytes in hex. The API signs decision requests with it and the worker verifies
#                           with it: both services mount this one file. It is NOT in a backup (see
#                           docs/operations/backup-and-restore.md for what its loss means).
#   webhook_secret          the secret of the GitHub webhook deliveries; only the API reads it.
secrets:
  pg_superuser_password:
    file: ${FACTORY_SECRETS_DIR:?Set FACTORY_SECRETS_DIR to a folder of secret files, or run scripts/local-up.sh}/pg_superuser_password
  pg_url_api:
    file: ${FACTORY_SECRETS_DIR:?Set FACTORY_SECRETS_DIR to a folder of secret files, or run scripts/local-up.sh}/pg_url_api
  pg_url_worker:
    file: ${FACTORY_SECRETS_DIR:?Set FACTORY_SECRETS_DIR to a folder of secret files, or run scripts/local-up.sh}/pg_url_worker
  pg_url_engine:
    file: ${FACTORY_SECRETS_DIR:?Set FACTORY_SECRETS_DIR to a folder of secret files, or run scripts/local-up.sh}/pg_url_engine
  decision_signing_key:
    file: ${FACTORY_SECRETS_DIR:?Set FACTORY_SECRETS_DIR to a folder of secret files, or run scripts/local-up.sh}/decision_signing_key
  webhook_secret:
    file: ${FACTORY_SECRETS_DIR:?Set FACTORY_SECRETS_DIR to a folder of secret files, or run scripts/local-up.sh}/webhook_secret
