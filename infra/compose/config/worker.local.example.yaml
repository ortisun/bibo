# The worker's configuration file in the local stack (infra/compose/local.yml, profile "factory").
#
# This is the file the stack mounts at /etc/factory/worker.yaml. crates/composition/tests/examples.rs reads THIS
# file and runs it through the worker's own parser, so it cannot drift from the code: an unknown or misspelled
# setting is an error there, as it is in the worker. The keys are listed in docs/reference/configuration.md.
# Copy it to a file of your own (FACTORY_WORKER_CONFIG) to change it.
#
# No secret is here. Every secret is the path of a file that Compose mounts under /run/secrets, and the files
# are made by scripts/local-up.sh (infra/compose/secrets, never committed). The worker mounts the database URL
# files of its two logins and the decision signing key, which is the SAME file the API signs with.
#
# What this stack cannot fill in, because it needs a real credential, which a deployment script must not invent:
#   * broker.upstreams (a model provider and its key file); the models and prices come from policies/model_routing.yaml
#   * github.app_id and github.key_file (a registered GitHub App)
#   * worker.tenants (the tenant ids the worker serves)
# Until they are supplied the worker prints BLOCKED lines and exits with code 3, which is the right answer
# (docs/reference/commands.md, "The BLOCKED lines of the worker").

profile: local
protected_checkout: /srv/factory/protected
definitions_root: /srv/factory/protected

database:
  tenant: { url_file: /run/secrets/db_worker, login: factory_worker, max_connections: 8 }
  system: { url_file: /run/secrets/db_engine, login: factory_engine, max_connections: 4 }

artifacts: { root: /var/lib/factory/artifacts }

sandbox:
  images_catalog: /srv/factory/protected/infra/sandbox-images/images.json
  # The two paths below are mounted into sandbox containers by the Docker daemon, so they are paths on the
  # machine where the daemon runs, not paths inside this container. A containerized worker cannot make them work
  # without bind mounts whose inside and outside paths are equal. See docs/operations/local-deployment.md,
  # "Docker access, an open decision".
  token_root: /var/lib/factory/tokens
  workspace_root: /var/lib/factory/workspaces
  # Where the Docker daemon is. The worker starts the docker client with an empty environment, so a DOCKER_HOST in
  # the container's environment does NOT reach it; these two keys are the only way (docs/reference/configuration.md, "sandbox").
  # docker_host: unix:///var/run/docker.sock   # or tcp://127.0.0.1:2375; a tcp host that is not loopback needs allow_remote_docker: true (never in production)
  # docker_config: /home/factory/.docker       # an absolute path to a directory that exists where the worker runs; it may not hold a Docker context or a credential helper (DR-6)
  # allow_docker_config_contexts: true          # lifts that check outside production; whoever can write the directory then chooses the daemon
  # remote: { https_host: github.com }   # or { directory: /abs/path } outside production
  # sidecar_command: []                  # the egress sidecar's arguments; with none the real sidecar refuses to start

broker:
  # Sidecars on the internal "broker" network reach the broker here, so it listens on every address of the
  # container, not on loopback. The "data" network is the only other network the worker is on.
  listen: 0.0.0.0:8731
  upstreams: []
  prices: []

decisions:
  key_file: /run/secrets/decision_signing_key   # the SAME file the API signs with; mode 0600; 32 bytes or more

# stages:
#   definition_commit: 1405df66cbe219b0bf6355bc3d60361a8376b6b4   # required in production
# github: { app_id: 0, key_file: /run/secrets/github_app_key }     # needs a registered GitHub App
# The rest of the GitHub App, once it is registered (docs/reference/configuration.md, "github"):
#   github:
#     app_id: 0
#     key_file: /run/secrets/github_app_key
#     api_base_url: https://api.github.com          # production accepts this value only
#     web_base_url: https://github.com              # the host of the links the factory writes; a GitHub Enterprise host must also be in output_hygiene.allow_link_domains
#     installations:                                # which installation covers which repository
#       - { tenant: 00000000-0000-0000-0000-000000000000, repository: owner/name, installation_id: 0 }
#     bypass_attestations:                          # an administrator's statement; without it the repository runs at L0
#       - { tenant: 00000000-0000-0000-0000-000000000000, repository: owner/name, principal: 00000000-0000-0000-0000-000000000000, recorded_at: '2026-01-01T00:00:00Z' }
#     workflow_exposure_acknowledgements:           # only for a repository whose workflows are exposed to factory branches on purpose; names exactly those workflows
#       - { tenant: 00000000-0000-0000-0000-000000000000, repository: owner/name, principal: 00000000-0000-0000-0000-000000000000, recorded_at: '2026-01-01T00:00:00Z', workflows: ['.github/workflows/ci.yml'] }
# A model provider: the key is a file, and the models, prices and ceilings come from policies/model_routing.yaml.
#   broker:
#     upstreams:
#       - { provider: anthropic, base_url: 'https://api.anthropic.com', key_file: /run/secrets/anthropic_key }
#       - { provider: openai, base_url: 'https://api.openai.com', key_file: /run/secrets/openai_key, models: [gpt-6.1-sol] }
# The package registry and the advisory database date, which the dependency gates read:
# registry: { base_url: 'https://crates.io', user_agent: 'software-factory (operator@example.org)' }
# advisory_database: { date_file: /srv/factory/protected/advisory-database.date }
# Where the agent tools are in the agent image (the defaults match the pinned image):
# runtimes: { claude_code: { binary: /usr/local/bin/claude, versions: ['2.1.311'] }, codex: {} }
# worker: { name_prefix: worker, poll_interval_ms: 1000, sweep_interval_s: 10, drain_s: 120, tenants: [] }
