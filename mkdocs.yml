# The documentation site, served by GitHub Pages at site_url.
# Build or preview it with scripts/docs-site.sh; ADR 0033 records why it is built this way.
site_name: Bibo
site_description: An agentic software factory that turns an approved GitHub issue into a reviewed draft pull request with an evidence trail.
site_url: https://ortisun.github.io/bibo/
repo_url: https://github.com/ortisun/bibo
repo_name: ortisun/bibo
edit_uri: edit/develop/docs/
copyright: Copyright &copy; 2026 The Bibo Authors. Released under the <a href="https://github.com/ortisun/bibo/blob/develop/LICENSE">MIT License</a>.

docs_dir: docs
exclude_docs: |
  architecture/tools/
  reference/tools/

# A broken link or anchor is a warning, and scripts/docs-site.sh builds with --strict, so it fails.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

hooks:
  - .github/tools/mkdocs/hooks.py

theme:
  name: material
  logo: assets/bibo-logo.svg
  favicon: assets/bibo-logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to the dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to the light theme
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ortisun/bibo
      name: Bibo on GitHub

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

