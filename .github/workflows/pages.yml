# Documentation site.
#
# Builds the site from docs/ with scripts/docs-site.sh, the same command that scripts/ci.sh runs on
# every pull request, and deploys it to GitHub Pages. ADR 0033 records the decision.
#
# Rules this file follows (scripts/ci.sh checks them in its "workflow-policy" step):
#   * Every action is pinned to a full commit SHA, with its tag in a comment.
#   * Nothing from a pull request can start this workflow: it runs on a push to develop, the
#     branch the site shows, and when a person starts it by hand. That is the condition under
#     which the workflow rule allows the two write permissions below.
#   * The token can only read the repository at the top level. The deploy job alone asks for
#     "pages: write" (to publish) and "id-token: write" (to prove to Pages that this run is this
#     repository's). No other write permission and no secret is used.
#   * No text from the event (commit message, branch name) is used anywhere in this file.

name: pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A newer push waits for the running deploy instead of cancelling it, so
# the site is never left half published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      # v7.0.1 (2026-07-20), the same pin as ci.yml.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # install-action v2.87.28 (2026-10-12), the same pin and uv version as ci.yml.
      - name: Install uv
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: uv@0.13.0

      - name: Build the site with every warning treated as an error
        run: scripts/docs-site.sh build --site-dir "$RUNNER_TEMP/site"

      # v5.0.0 (2026-04-10). It pins its own upload-artifact by SHA.
      - name: Keep the site for the deploy job
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # v5.0.1 (2026-09-01).
      - name: Deploy the site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
