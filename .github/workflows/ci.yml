# Continuous integration.
#
# This workflow does two things: it installs the tools the checks need, and it runs
# scripts/ci.sh. It holds no check logic of its own. Every check lives in scripts/ci.sh, which
# a developer runs the same way on a laptop, so a result here and a result there cannot drift.
#
# Rules this file follows (scripts/ci.sh enforces them in its "workflow-policy" step):
#   * Every action is pinned to a full commit SHA. A version tag can be moved to different code.
#     The tag is kept in a comment so a person can see what the SHA means.
#   * The trigger is "pull_request", never "pull_request_target". A pull request from a fork
#     runs without secrets and with a read-only token. This workflow reads no secret at all.
#   * The token can only read the repository. The checkout does not keep it for later steps.
#   * No text from the pull request (title, branch name, body) is used anywhere in this file.
#
# Why the install steps are here and not in scripts/ci.sh: installing a tool changes the
# machine, and running a check must not. A missing tool is reported by scripts/ci.sh as BLOCKED.
#
# Tool versions are pinned here, in .github/tools/pyright/, and as PIN_* lines in scripts/lib/tool-pins.sh
# (read by scripts/ci.sh and scripts/setup-tools.sh). Change a version in every place, in one pull request.
# The "tool-pins" step of scripts/ci.sh fails if the places disagree.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read the repository, nothing else.
permissions:
  contents: read

# A new push to a pull request cancels the older run. A run on main is never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: scripts/ci.sh
    # arm64, the platform the sandbox images are pinned for (infra/sandbox-images/images.json), so
    # the images built below can be checked against the committed digests (ADR 0034).
    runs-on: ubuntu-24.04-arm
    # One stuck step must not hold a runner for the default six hours. Building the images and
    # running every test takes most of an hour on this runner.
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    # The database tests use the server that FACTORY_DB_ADMIN_URL names (docs/database/running.md),
    # started in a step below. It accepts any local connection without a password ("trust", as the
    # private server of the tests does), listens on the runner's loopback only and lives as long as
    # the job, so no password is written anywhere.
    env:
      FACTORY_DB_ADMIN_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      # v7.0.1 (2026-07-20). The whole history is needed: scripts/ci.sh scans every commit for
      # secrets and reports BLOCKED on a shallow clone.
      - name: Check out the repository with its full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # rust-toolchain.toml names the version, the profile and the components. With no argument,
      # rustup installs exactly that, so the version is written in one place only.
      - name: Install the Rust toolchain named in rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      # Prebuilt, checksum-verified binaries for the versions named here.
      # install-action v2.87.28 (2026-10-12). uv 0.13.0 is the newest uv that release lists.
      - name: Install cargo-nextest, cargo-deny, cargo-audit, shellcheck and uv
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest@0.9.137,cargo-deny@0.19.9,cargo-audit@0.22.2,shellcheck@0.11.0,uv@0.13.0

      # gitleaks and actionlint are not offered by the action above, so they are downloaded from
      # their own GitHub releases. The SHA-256 of each archive is written here, in the repository,
      # so a swapped release file is refused. The hashes were checked against the checksum files
      # published with each release (gitleaks 8.30.1, actionlint 1.7.12).
      - name: Install gitleaks and actionlint with checked hashes
        run: |
          set -euo pipefail
          bin_dir="$RUNNER_TEMP/tools/bin"
          mkdir -p "$bin_dir"
          fetch() {
            local url="$1" sha256="$2" archive="$RUNNER_TEMP/$3"
            curl --fail --silent --show-error --location --retry 3 --output "$archive" "$url"
            echo "$sha256  $archive" | sha256sum --check --strict -
          }
          fetch "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_arm64.tar.gz" \
            e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080 gitleaks.tar.gz
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$bin_dir" gitleaks
          fetch "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_arm64.tar.gz" \
            325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6 actionlint.tar.gz
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$bin_dir" actionlint
          echo "$bin_dir" >> "$GITHUB_PATH"

      # "npm ci" installs exactly what .github/tools/pyright/package-lock.json lists and refuses a
      # package whose hash differs. The install happens in a temporary folder, so no node_modules
      # appears in the repository. Install scripts are switched off.
      - name: Install pyright from its lockfile
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pyright"
          cp .github/tools/pyright/package.json .github/tools/pyright/package-lock.json "$RUNNER_TEMP/pyright/"
          (cd "$RUNNER_TEMP/pyright" && npm ci --ignore-scripts --no-audit --no-fund)
          echo "$RUNNER_TEMP/pyright/node_modules/.bin" >> "$GITHUB_PATH"

      # The image builds below need the Docker engine the images were pinned with: Docker 28, which
      # the runner ships, has a BuildKit that refuses the reproducible export of the recipes with the
      # containerd image store ("rewrite-timestamp conflicts with unpack"), and its classic store
      # does not report the manifest digest the build records. So the engine, buildx and containerd
      # are the versions of the owner's machine (Docker Desktop: engine 29.9.3, buildx 0.38.1,
      # containerd 2.4.2), from Docker's signed apt repository, whose key is checked by fingerprint.
      # The containerd image store is switched on before anything is pulled, because a restart of
      # the daemon with the other store hides every image pulled before it.
      - name: Install the pinned Docker engine with the containerd image store
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/docker.asc" https://download.docker.com/linux/ubuntu/gpg
          gpg --show-keys --with-colons "$RUNNER_TEMP/docker.asc" | grep -q '^fpr:::::::::9DC858229FC7DD38854AE2D88D81803C0EBFCD88:$'
          sudo install -m 0644 "$RUNNER_TEMP/docker.asc" /etc/apt/keyrings/factory-docker.asc
          echo "deb [arch=arm64 signed-by=/etc/apt/keyrings/factory-docker.asc] https://download.docker.com/linux/ubuntu noble stable" \
            | sudo tee /etc/apt/sources.list.d/factory-docker.list >/dev/null
          sudo rm -f /etc/apt/sources.list.d/docker.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq --allow-downgrades \
            docker-ce=5:29.9.3-1~ubuntu.24.04~noble docker-ce-cli=5:29.9.3-1~ubuntu.24.04~noble \
            containerd.io=2.4.2-4~ubuntu.24.04~noble docker-buildx-plugin=0.38.1-1~ubuntu.24.04~noble
          sudo python3 - <<'PY'
          import json, os
          path = "/etc/docker/daemon.json"
          config = json.load(open(path)) if os.path.exists(path) else {}
          config.setdefault("features", {})["containerd-snapshotter"] = True
          json.dump(config, open(path, "w"), indent=2)
          PY
          sudo systemctl restart docker
          docker version --format 'engine {{.Server.Version}}'
          docker buildx version
          docker info --format '{{.DriverStatus}}' | grep -q 'io.containerd.snapshotter' || { docker info; exit 1; }

      # The image is the one infra/compose/local.yml pins, by the digest of its multi-platform index.
      # The settings are those of the tests' own private server: no fsync, room for the connections
      # of many test processes at once. A GitHub service container cannot pass them, so this is a step.
      - name: Start the PostgreSQL server of the database tests
        run: |
          set -euo pipefail
          docker run -d --name factory-ci-postgres -e POSTGRES_HOST_AUTH_METHOD=trust -p 127.0.0.1:5432:5432 \
            postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6 \
            -c fsync=off -c max_connections=300
          for _ in $(seq 60); do
            if docker exec factory-ci-postgres pg_isready -U postgres -h 127.0.0.1 >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs factory-ci-postgres
          exit 1

      # The images the tests run, made here because making them changes the machine and a check
      # must not (ADR 0034). The sandbox build writes its digests to a file of its own, never to the
      # committed images.json: the tests look the images up by the committed digests, so an image
      # that does not reproduce on this runner stays absent and its tests report BLOCKED.
      - name: Pull the pinned public images of the tests
        run: |
          set -euo pipefail
          # alpine/git: the hostile git configuration test of the testkit.
          docker pull alpine/git@sha256:ac6c828f15d82775d204d3d75112e1d34af8945da80ccf922713c9891ba68e7a
          # python: the fake provider of the runtime and egress tests.
          docker pull python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e

      - name: Build the sandbox images
        env:
          FACTORY_IMAGES_JSON: ${{ runner.temp }}/built-images.json
        run: |
          set -euo pipefail
          cp infra/sandbox-images/images.json "$FACTORY_IMAGES_JSON"
          infra/sandbox-images/build.sh --only verify --only agent
          # The sidecar program, compiled in the verify image as infra/sandbox-images/egress-sidecar/README.md says.
          verify=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["platforms"]["linux/arm64"]["images"]["verify"]["reference"])' "$FACTORY_IMAGES_JSON")
          out="$RUNNER_TEMP/sidecar" && mkdir -p "$out" && chmod 777 "$out"
          docker run --rm --pull=never --user 10000:10000 --cap-drop ALL --security-opt no-new-privileges --read-only \
            -v "$PWD":/src:ro -v "$out":/target --tmpfs /home/agent:rw,exec,uid=10000,gid=10000,size=1g --tmpfs /tmp:rw,exec,size=512m \
            --workdir /src -e CARGO_TARGET_DIR=/target -e CARGO_HOME=/home/agent/.cargo -e HOME=/home/agent -e CARGO_INCREMENTAL=0 \
            "$verify" cargo build --release --locked -p factory-egress-sidecar
          sha=$(sha256sum "$out/release/factory-egress-sidecar" | cut -d' ' -f1)
          infra/sandbox-images/build.sh --only egress-sidecar --sidecar-binary "$out/release/factory-egress-sidecar" --sidecar-sha256 "$sha"

      # Shows whether each recipe reproduced the committed digest. It decides nothing: the tests do.
      - name: Compare the built sandbox digests with the committed ones
        run: |
          python3 - "$RUNNER_TEMP/built-images.json" infra/sandbox-images/images.json <<'PY'
          import json, sys
          built, pinned = (json.load(open(p))["platforms"]["linux/arm64"]["images"] for p in sys.argv[1:])
          for role in sorted(pinned):
              a, b = built.get(role, {}).get("digest"), pinned[role].get("digest")
              print(f"{'same     ' if a == b else 'DIFFERENT'} {role}: built {a}, pinned {b}")
          PY

      - name: Build the API and worker images
        run: infra/service-images/build.sh

      # The one command that matters. It exits 0 only if every step passed, 1 if a step failed,
      # and 3 if a step was BLOCKED (for example a missing tool). The summary is also saved.
      # It runs as the runner user with CAP_CHOWN as an ambient capability and nothing more: what a
      # worker on a Linux host holds to hand the job token file to the sandbox user (ADR 0035).
      # Root only sets the capability; the checks never run as root.
      - name: Run scripts/ci.sh
        run: |
          set -euo pipefail
          command -v capsh >/dev/null || sudo apt-get install -y -qq libcap2-bin
          sudo --preserve-env env "PATH=$PATH" "HOME=$HOME" \
            capsh --caps="cap_setpcap,cap_setuid,cap_setgid+ep cap_chown+eip" --keep=1 --user="$(id -un)" --addamb=cap_chown \
            -- -c 'if ! grep -q "^CapAmb:.*0000000000000001$" /proc/self/status || [ "$(id -u)" = 0 ]; then
                     echo "the gate must run as the runner user with CAP_CHOWN alone"; id; grep ^Cap /proc/self/status; exit 1
                   fi
                   exec scripts/ci.sh --json-file "$RUNNER_TEMP/ci-summary.json"'

      # v7.0.2 (2026-10-07). Kept even when the run fails, because that is when it is read.
      - name: Keep the machine-readable summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-summary
          path: ${{ runner.temp }}/ci-summary.json
          if-no-files-found: warn
          retention-days: 30
