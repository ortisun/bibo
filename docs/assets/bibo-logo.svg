    <circle cx="33.4" cy="93.1" r="14"/>
    <circle cx="26.4" cy="82.3" r="12"/>
    <circle cx="24.0" cy="70.0" r="12"/>
    <circle cx="26.4" cy="57.7" r="12"/>
