[package]
name = "factory-ports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# Every external crate below is on the `ports` allow list in
# docs/architecture/crate-dependency-rules.json (rule DEP-04). Versions are the releases checked
# with `cargo info` on 2026-10-27 and match the versions `factory-domain` already pins, so the
# workspace builds one copy of each.
[dependencies]
factory-domain.workspace = true
# Lets a trait with `async fn` methods be used as `dyn Trait` (`Box<dyn Tx>`, `&mut dyn
# SandboxSession`, `&dyn CancelSignal`). The slice plan sketches every port with `#[async_trait]`
# and the engine needs trait objects, so this is the strategy the plan prescribes. See the crate
# documentation, section "Async strategy". Maintained by dtolnay, version 0.1.92.
async-trait = "0.1.92"
# The unvalidated agent output (`AgentRunOutcome::output`) and the input of `OutputValidator`.
# Only the value type is used, so default features stay off.
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
# Derive for the closed error enums. Maintained by dtolnay.
thiserror = "2.0.21"
# `Uuid` in the `IdGenerator` signature. The `v4` and `v7` generator features are off, so this
# crate cannot make an identifier: identifiers come from the `IdGenerator` port.
uuid = { version = "1.29.0", default-features = false, features = ["std"] }
# Adds a `std::time::Duration` to a `Timestamp` and measures the gap between two (lease expiry,
# token expiry). The `std` feature is off, so `now_utc` does not exist here.
time = { version = "0.3.55", default-features = false }
# Unicode NFC folding for protected-path matching (ports-v1.1 decision 4). No I/O, pure functions only.
# License: (MIT OR Apache-2.0) AND Unicode-3.0, all on the deny.toml allow list. Already in Cargo.lock.
unicode-normalization = { version = "0.1.26", default-features = false, features = ["std"] }
