# =============================================================================
# policies/approval.yaml  -  autonomy levels and human gates
# =============================================================================
# STATUS: DESIGNED. Product code reads this file: `load_policy` in
# crates/composition/src/startup.rs loads it with the security policy and builds
# the policy engine from both, and the API reads the `actions` table below to
# decide who may take which decision. The flag `policy.status` below is a label
# that no code reads or switches on.
#
# Defaults required by the master prompt:
#   * start in human-approval mode
#   * auto-merge is OFF
#   * deployment is a separate opt-in workflow and is OFF
#   * approve, reject, pause, rework and cancel are supported from the dashboard,
#     the CLI and GitHub comments, each with authorization validation
#
# This file shares the parser contract of policies/security.yaml: YAML 1.2
# subset, no anchors or merge keys, `deny_unknown_fields`, `schema_version`
# check, deny_overrides, tighten-only project overrides, and a policy hash on
# every approval record. Read the header of security.yaml first.
#
# Vocabulary
#   requires: none            the policy engine alone decides from gate evidence
#   requires: human           a named, authorized human decision is mandatory
#   requires: human_and_policy  both must agree; the human cannot override a
#                              failed non-waivable gate (see security.yaml
#                              gate_integrity.nonwaivable_gates)
#   requires_by_level         map from autonomy level to one of: forbidden | none |
#                             human | policy | human_and_policy. Used when the
#                             answer changes with the level. Exactly one of
#                             `requires` and `requires_by_level` is present.
#   min_level                 lowest autonomy level at which the action exists
#   role                      a factory designation held by being named on the
#                             allowlist (see `authority` and `roles`). A GitHub role
#                             or permission never grants one.
# =============================================================================

schema_version: 1

policy:
  id: approval
  version: 1
  status: designed                    # enum: designed | enforced
  default_action: require_human       # anything not listed in `actions` needs a human
  conflict_resolution: deny_overrides
  project_overrides: tighten_only
  config_source: protected_default_branch
  threats: [T-14, T-23, T-24]

# -----------------------------------------------------------------------------
# 1. Autonomy levels
# -----------------------------------------------------------------------------
# A repository runs at exactly one level. Raising a level is an `always_human`
# action with an org_admin approver and an audit event. Lowering is allowed for
# any repo_admin. A repository that fails the checks in
# security.yaml credentials.repository_requirements is capped at L0.
autonomy:
  default_level: L1
  levels:
    - id: L0
      name: observe_only
      description: "Reads issues and repository, posts comments and status. No branches, no pull requests."
      github_writes: [comment, status, check_run]
    - id: L1
      name: human_approval
      description: "DEFAULT. Creates factory branches and DRAFT pull requests. Every promotion step needs a human."
      github_writes: [comment, status, check_run, push_factory_branch, open_draft_pr, update_draft_pr]
      human_required_for: [spec_freeze_when_risk_at_least_medium, mark_pr_ready, merge_pr]
    - id: L2
      name: assisted_ready
      description: "May mark a pull request ready for review when all gates pass. A human still merges."
      github_writes: [comment, status, check_run, push_factory_branch, open_draft_pr, update_draft_pr, mark_pr_ready]
      human_required_for: [merge_pr]
      preconditions: [all_gates_PASSED, no_protected_path_change, risk_tier_at_most_medium, security_review_PASS]
    - id: L3
      name: auto_merge_low_risk
      description: "OFF. Documented so the shape is fixed. Needs explicit per-repo opt-in."
      enabled: false
      github_writes: [comment, status, check_run, push_factory_branch, open_draft_pr, update_draft_pr, mark_pr_ready, merge_pr]
      human_required_for: []
      opt_in_requires: [human_approval_by_org_admin, written_justification]
      eligibility_all_of:
        - risk_tier_is_low
        - no_protected_path_change
        - no_sensitive_file_change
        - no_new_dependency
        - all_gates_PASSED_on_final_head_sha
        - independent_review_PASS_with_no_open_findings
        - security_review_PASS
        - documentation_gate_PASSED_or_NOT_APPLICABLE
        - branch_protection_and_required_checks_intact
        - final_validation_after_rebase_or_sync
        - authorized_identity_recorded
        - audit_event_written_before_merge
      revoke_automatically_on: [escaped_defect_in_repo, nonwaivable_gate_failure, policy_change, security_incident]
  deploy:
    enabled: false                    # deployment is a separate opt-in workflow, never part of the default loop
    autonomous: never
    requires: human
    approver_roles: [org_admin]
  auto_merge:
    enabled: false
    per_repo_opt_in_only: true

# -----------------------------------------------------------------------------
# 2. Authority: roles come from a named allowlist (ADR 0009 item 5)
# -----------------------------------------------------------------------------
# GitHub repository roles and permissions DO NOT grant factory authority. A person
# holds a factory designation only by being named on the allowlist below. Holding
# admin on a repository, being an organization owner, or appearing as OWNER or
# MEMBER in a webhook `author_association` grants nothing. Requesters, operators,
# approvers, security approvers and administrators are all designations on the
# SAME allowlist; an operator is a different designation, not a different list.
#
# Why: a named list is explicit and reviewable, and it does not depend on
# repository settings that a repository administrator can change. Revocation is
# removing the entry. No GitHub lookup is needed to revoke, and none is used to
# authorize.
authority:
  source: named_allowlist
  location: protected_configuration       # same protected source as this file; the file name is set by the configuration ADR
  read_from: [protected_default_branch, signed_release]
  never_read_from: [target_repository, feature_branch, builder_workspace, dashboard_database, issue_or_comment_text]
  identity_key: github_user_numeric_id    # the immutable numeric user ID; a login can be renamed or re-registered by someone else
  login_is_display_only: true
  scope: tenant                           # an entry belongs to one tenant and may be narrowed to listed repositories
  entry_fields: [tenant_id, github_user_id, login, designations, repositories, added_by, added_at, expires_at]
  entry_expiry: optional                  # an entry with expires_at stops granting authority at that time
  bots_may_be_listed: false               # designations apply to human users only
  github_permission:
    can_grant_authority: false
    additional_condition:                 # optional extra requirement. It can only deny. It never grants.
      enabled: false
      at_least: triage
      can_only_deny: true
  allowlist_changes:
    action: change_authority_allowlist    # see `actions`; always a human decision
    requires_distinct_org_admins: 2       # for any change that adds or widens security_approver or org_admin
    self_grant_allowed: false
    audit: every_change_recorded_with_before_and_after_hash
  evaluated: at_decision_time_not_cached  # membership is read from the loaded allowlist version for each decision; its hash is recorded
roles:
  - id: requester
    designation: requester
    description: "May submit a request (apply the `factory` label, use the API or CLI)."
  - id: operator
    designation: operator
    description: "May pause, resume, cancel and view jobs. A separate designation on the same allowlist."
  - id: approver
    designation: approver
    description: "May approve, reject and request rework."
    must_be_human_user: true          # sender.type == User; bots never approve
  - id: security_approver
    designation: security_approver
    description: "May approve changes to protected paths, egress, tool grants and sandbox settings."
  - id: repo_admin
    designation: repo_admin
    description: "May lower autonomy and change the factory's settings for a repository. A factory designation, not a GitHub role."
  - id: org_admin
    designation: org_admin
    description: "May raise autonomy, enable auto-merge or deploy, change budgets above ceilings, and edit the allowlist."
separation_of_duties:
  approver_must_differ_from_requester_when:
    - risk_tier_at_least_high
    - protected_path_change
    - sensitive_file_change
    - new_dependency
  approver_may_equal_requester_when_low_risk: true      # single-maintainer repositories
  factory_app_may_approve: false
  security_approver_must_differ_from_requester: true

# -----------------------------------------------------------------------------
# 3. Risk tiers (inputs to routing and to the checks above)
# -----------------------------------------------------------------------------
risk_tiers:
  - id: low
    criteria_any: [docs_only, tests_only_new_files, single_module_change_without_sensitive_or_protected_paths]
    required_reviews: [code_reviewer]
    required_approvals: 1
  - id: medium
    criteria_any: [multi_module_change, public_api_change, schema_migration_without_data_loss]
    required_reviews: [code_reviewer, qa]
    required_approvals: 1
  - id: high
    criteria_any: [authn_authz_change, secret_handling_change, new_dependency, sensitive_file_change, data_migration, concurrency_or_locking_change, infra_change]
    required_reviews: [code_reviewer, qa, security_reviewer, adversarial_reviewer]
    required_approvals: 1
    approver_must_differ_from_requester: true
  - id: critical
    criteria_any: [protected_path_change, policy_or_sandbox_change, money_movement, physical_actuation, regulated_workflow, production_data_access]
    required_reviews: [code_reviewer, qa, security_reviewer, adversarial_reviewer]
    required_approvals: 2
    approver_roles: [security_approver]
    approver_must_differ_from_requester: true

risk_classification:
  computed_by: policy_engine_from_trusted_diff_and_spec   # never self-reported by an agent
  agent_may_lower_tier: false
  agent_may_raise_tier: true

# -----------------------------------------------------------------------------
# 4. Action table
# -----------------------------------------------------------------------------
# Every factory-initiated side effect has a row. A missing row means
# `requires: human` (the policy default_action).
#   min_level  lowest autonomy level at which the factory may attempt it
actions:
  - { id: accept_issue_for_intake,        min_level: L0, requires: none,             when: "label `factory` applied by a person on the requester allowlist, matched by numeric user ID", threats: [T-23] }
  - { id: post_comment,                   min_level: L0, requires: none,             when: "text passes output_hygiene and secret checks", threats: [T-18] }
  - { id: set_status_or_check,            min_level: L0, requires: none,             when: "result derived from supervisor-observed gate evidence", threats: [T-13] }
  - { id: push_factory_branch,            min_level: L1, requires: none,             when: "branch matches factory/*, diff passes protected_path_check and secret_scan", threats: [T-12, T-24] }
  - { id: open_draft_pr,                  min_level: L1, requires: none,             when: "branch pushed; body passes output_hygiene", threats: [T-18] }
  - { id: freeze_specification,           min_level: L1, requires: human,            when: "risk tier at least medium or open questions remain; below that the spec gate decides", approver_roles: [approver], threats: [T-01, T-23] }
  - { id: mark_pr_ready,                  min_level: L1, requires_by_level: { L0: forbidden, L1: human, L2: policy, L3: policy }, approver_roles: [approver], when: "policy means the L2 preconditions are satisfied", threats: [T-14] }
  - { id: merge_pr,                       min_level: L1, requires_by_level: { L0: forbidden, L1: human, L2: human, L3: policy }, approver_roles: [approver], when: "L3 is disabled; a human merge still passes the policy checks and is bound to the head SHA", threats: [T-14] }
  - { id: approve_pr,                     min_level: L1, requires: human,            approver_roles: [approver], threats: [T-23] }
  - { id: reject_or_request_rework,       min_level: L1, requires: human,            approver_roles: [approver], threats: [T-23] }
  - { id: pause_or_resume_job,            min_level: L1, requires: human,            approver_roles: [operator], threats: [T-23] }
  - { id: cancel_job,                     min_level: L1, requires: human,            approver_roles: [operator], threats: [T-23] }
  - { id: close_or_label_issue,           min_level: L1, requires: none,             when: "limited to labels in the factory namespace" }
  - { id: add_new_direct_dependency,      min_level: L1, requires: human,            approver_roles: [approver], when: "always, for a package name absent from the base commit lockfile as anything but a member of the project; no allowlist or heuristic approves it; a package first published less than 30 days ago needs a security_approver; the decision is bound to the exact name, version and checksum, and it does not cover the build code of a new package: a build script or a procedural macro that comes in needs its own decision, approve_build_code", threats: [T-29] }
  - { id: approve_build_code,             min_level: L1, requires: human,            approver_roles: [security_approver], when: "always, for each package that is new to the build and has a build script or is a procedural macro, whoever asked for it (new direct dependency or not); the decision is bound to the exact name, version and checksum of that package, and nothing else lifts the block of the semantic check build_script_added", threats: [T-29, T-30] }
  - { id: run_fetch_deps,                 min_level: L1, requires: none,             when: "after dependency policy decision; allowlisted registries only", threats: [T-29] }
  - { id: change_protected_path,          min_level: L1, requires: human_and_policy, approver_roles: [security_approver], when: "needs spec_authorization AND independent_policy_review AND human_approval", threats: [T-12] }
  - { id: grant_tool_outside_manifest,    min_level: L1, requires: human,            approver_roles: [security_approver], threats: [T-06] }
  - { id: use_exec_shell_breakglass,      min_level: L1, requires: human,            approver_roles: [security_approver], when: "per call, single task, recorded", threats: [T-06] }
  - { id: widen_egress_allowlist,         min_level: L1, requires: human,            approver_roles: [security_approver], threats: [T-17] }
  - { id: raise_budget_ceiling,           min_level: L1, requires: human,            approver_roles: [org_admin], threats: [T-26] }
  - { id: install_spec_kit_or_tooling,    min_level: L1, requires: human,            approver_roles: [repo_admin], when: "the master prompt forbids running installation scripts without authorization" }
  - { id: change_authority_allowlist,     min_level: L1, requires: human,            approver_roles: [org_admin], when: "adds, removes or widens a designation; adding or widening security_approver or org_admin needs two distinct org_admins and never self-granted", threats: [T-23, T-24] }
  - { id: accept_subscription_login_exception, min_level: L1, requires: human,       approver_roles: [org_admin, security_approver], when: "both sign; needs a written provider-terms determination, a named demo profile, a dedicated host, a fixture repository only and an expiry of at most 30 days (secrets-and-credentials.md section 4.5)", threats: [T-19, T-20] }
  - { id: waive_failed_gate,              min_level: L1, requires: human,            approver_roles: [security_approver], when: "only gates NOT listed in security.yaml gate_integrity.nonwaivable_gates; waiver has an owner and an expiry", threats: [T-13] }
  - { id: accept_residual_risk,           min_level: L1, requires: human,            approver_roles: [security_approver], when: "owner and expiry recorded", threats: [T-31] }
  - { id: send_code_to_new_model_provider, min_level: L1, requires: human,           approver_roles: [org_admin], threats: [T-20, T-28] }
  - { id: write_to_additional_repository, min_level: L1, requires: human,            approver_roles: [org_admin], when: "a job is bound to exactly one repository; cross-repository writes are a new job", threats: [T-24] }
  - { id: raise_autonomy_level,           min_level: L0, requires: human,            approver_roles: [org_admin], when: "moves a repository up the ladder, never to a level that is turned off (L3); a repository capped at L0 is raised from L0; needs step-up authentication; recorded as an audit event", threats: [T-14, T-23] }
  - { id: lower_autonomy_level,           min_level: L0, requires: human,            approver_roles: [repo_admin, org_admin], when: "moves a repository down the ladder; a repo_admin may, and so may an org_admin, which is how the engine decides it", threats: [T-14, T-23] }
  - { id: unblock_blocked_stage_run,      min_level: L1, requires: human,            approver_roles: [operator], when: "a person who holds the operator designation lets a BLOCKED stage run go again once the cause is gone: the environment is repaired and the capability re-probe passes, or a decision on the dependency or on the build code it waited for was recorded after the attempt that blocked it (state machine transition S17, guard G_BLOCK_CLEARED_RERUN); the stage runs again and its gates judge the result, so this passes no gate and is not an override", threats: [T-13, T-23] }
  - { id: acknowledge_documentation_warning, min_level: L1, requires: human,         approver_roles: [approver], when: "one decision for each open warning of the reviewer rule `translation-unfaithful` in the gate reports of the evidence the approver saw; approval of the stage is refused while one has none (guard G_APPROVER_AUTHORIZED, ADR 0009 item 17)", threats: [T-23] }

# -----------------------------------------------------------------------------
# 5. Actions that ALWAYS require a human, at every level, for every repo
# -----------------------------------------------------------------------------
# No setting in this file or in a project policy can move one of these to
# `none`. A request to do so is itself recorded as a human decision.
#
# Two kinds of entry. An entry that is the id of a row in `actions` uses that id
# exactly, and the engine checks it: it refuses to build when the row lets the action
# happen with no human at any level. An entry that is not an id (the last group) is a
# descriptive name for something the factory has no row for, because it does not do it
# itself; a missing row needs a human by `policy.default_action` anyway. Descriptive names
# that used to stand for a row (`waive_any_gate`, `grant_tool_outside_agent_manifest`,
# `enable_exec_shell_breakglass`, `access_additional_repository_or_organization`,
# `send_code_to_additional_model_provider`, `install_or_update_spec_kit_or_other_tooling`)
# now carry the row's id, so they are checked.
always_human:
  # Ids of rows in `actions`.
  - raise_autonomy_level
  - change_protected_path
  - add_new_direct_dependency
  - approve_build_code
  - widen_egress_allowlist
  - grant_tool_outside_manifest
  - use_exec_shell_breakglass
  - raise_budget_ceiling
  - waive_failed_gate
  - accept_residual_risk
  - write_to_additional_repository
  - send_code_to_new_model_provider
  - install_spec_kit_or_tooling
  - change_authority_allowlist
  - accept_subscription_login_exception
  - acknowledge_documentation_warning
  - unblock_blocked_stage_run
  # Descriptive names. `merge_pr` has a row, and its L3 level is off, so the unconditional
  # statement is made here instead of on the row; `freeze_specification` is a human decision
  # only from risk tier medium up, so the unconditional statement is made here as well.
  - merge_to_default_branch_unless_L3_explicitly_enabled
  - enable_auto_merge_for_a_repository
  - any_deployment_or_release_publication
  - publish_package_or_container_image
  - create_or_push_tags
  - modify_ci_workflows_or_gate_configuration
  - modify_security_or_approval_policy
  - freeze_specification_with_risk_at_least_medium
  - delete_branch_repository_release_or_data
  - force_push_or_rewrite_history
  - money_movement_live_orders_or_capital_transfer
  - physical_actuation
  - regulated_or_compliance_sign_off
  - restore_or_rotate_credentials_after_incident
never_allowed_even_with_human_via_the_factory:
  - force_push_to_default_branch
  - bypass_branch_protection
  - disable_audit_logging
  - read_secret_values_into_agent_context
  - run_agent_with_unsandboxed_host_execution

# -----------------------------------------------------------------------------
# 6. What an approval is bound to, and when it stops being valid
# -----------------------------------------------------------------------------
approval_binding:
  binds_to: [pr_head_sha, tree_hash, evidence_manifest_hash, policy_hash, spec_version, base_sha]
  github_merge_must_pass_expected_head_sha: true
  expires_after_hours: 72
  # ONE list of reasons, and it is the one the store port uses: the five variants of
  # `ApprovalInvalidation` in crates/ports/src/store.rs, by name. They are also the items of
  # security.yaml `gate_integrity.invalidated_by` without `rebase`, which is a `new_commit`
  # (a rebase writes new commits, and a force push changes the head the same way). The table
  # that says which stage runs each one supersedes is in docs/architecture/state-machine.md.
  # An earlier draft of this file had seven reasons and no `image_change`; the image digest is
  # part of the evidence binding, so it is here.
  invalidated_by:
    - new_commit
    - base_moved
    - policy_change
    - image_change
    - spec_revision
  # Two conditions the earlier draft listed as reasons are not stored reasons. They are checked
  # when an approval is used (before DELIVERY pushes, when the approval is recorded and, in
  # Slice 4, right before a merge), and the approval is refused then:
  #   * a gate result changed: the evidence manifest hash the approver saw no longer equals the
  #     current one (`binds_to` holds that hash), which guard G_APPROVER_AUTHORIZED compares;
  #   * the approver was removed from the allowlist or the entry expired: authority is read from
  #     the allowlist version in force at decision time and is not cached.
  checked_when_used:
    - evidence_manifest_hash_differs_from_the_one_the_approver_saw
    - approver_removed_from_allowlist_or_entry_expired
  step_up_authentication_required_for: [change_protected_path, widen_egress_allowlist, raise_budget_ceiling, raise_autonomy_level, accept_residual_risk, waive_failed_gate]
  record_fields: [approval_id, tenant_id, job_id, action, approver_github_user_id, approver_designation, allowlist_version_hash, decision, binds_to, reason, channel, created_at]

# -----------------------------------------------------------------------------
# 7. Commands (dashboard, CLI, GitHub comments)
# -----------------------------------------------------------------------------
# One command set, three channels. The authorization rules are identical.
commands:
  verbs: [approve, reject, pause, resume, rework, cancel, unblock, approve-dependency, approve-build-code]
  channels: [dashboard, cli, github_comment]
  github_comment:
    prefix: "/factory"
    syntax: "/factory <verb> [free text reason]"
    accept_event: issue_comment.created      # edits never trigger a command
    first_line_only: true
    ignore_inside: [code_blocks, block_quotes, html_comments]
    ignore_if_sender_type_not: User
    ignore_senders: [self_app_bot, other_bots]
    authorization: allowlist_membership_by_numeric_user_id_with_required_designation
    unauthorized_response: silent_audit_only       # no oracle for outsiders; event is audited, nothing posted
    one_command_per_comment: true
  dashboard_and_cli:
    authentication: required
    csrf_protection: required_for_dashboard
    session_binding: tenant_scoped
  rate_limit: { per_user_per_minute: 20 }
  threats: [T-23, T-32]

# -----------------------------------------------------------------------------
# 8. Intake authorization
# -----------------------------------------------------------------------------
intake:
  trigger_label: factory
  authorizing_actor: label_sender            # the person who applied the label, not the issue author
  authorizing_actor_requires_designation: requester   # allowlist membership by numeric user ID (see `authority`); a GitHub role is not enough
  github_permission_is_authorization: false           # a repository permission, role or author_association never admits a request
  label_presence_alone_is_authorization: false   # templates and automation can apply labels for low-privilege authors
  snapshot_content_hash_at_authorization: true
  reauthorize_on_edit_by_actor_other_than_authorizer: true
  on_unauthorized: comment_once_with_reason_and_audit
  on_out_of_policy_request: reject_with_concise_explanation   # master prompt section 3
  threats: [T-23, T-01]
