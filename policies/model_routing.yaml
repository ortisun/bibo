# =============================================================================
# policies/model_routing.yaml  -  which models each agent role may use, what a
# model costs, and how much a stage or a job may spend
# =============================================================================
# STATUS: ENFORCED (the owner's decision of 2026-11-13).
# The prices were read from the providers' price pages on 2026-11-13; each model names its source. In subscription
# mode (ADR 0020) they are the list-price equivalent the broker uses for the job and day ceilings, not a bill. The
# ceilings and caps were chosen to be low, so that a mistake stops a job early and costs little; they were accepted
# as they are with the prices. The model names are the ones the
# agent manifests already list (`recommended_models` in agents/*/manifest.json); no other name was added, and none
# was made up.
#
# This file shares the parser contract of policies/security.yaml: YAML 1.2
# subset, no anchors or merge keys, no nulls, `deny_unknown_fields`, a
# `schema_version` check, deny_overrides, tighten-only project overrides and a
# policy hash. Read the header of security.yaml first.
#
# WHAT READS THIS FILE
#   The model router asks it for the candidates of a stage and a tier. The
#   engine asks it for the ceiling of a stage run and gives the broker a token
#   that holds only the models of the route and that ceiling. The broker prices
#   every answer with the `prices` below and stops the token when its ceiling
#   is reached. The loader (crates/contracts/src/policy/routing.rs) refuses a
#   file that breaks a rule written at the end of this header.
#
# WHAT IS NOT IN THIS FILE
#   * No key, no token and no secret. A provider key is a file named in the
#     worker configuration (`broker.upstreams[].key_file`), never a value here.
#   * No base URL. Where a provider is reached is deployment configuration.
#
# HOW TO READ A PRICE
#   A price is a whole number of millionths of a US dollar for a million tokens.
#   1000000 means one dollar for a million tokens. `price_checked_on` is the date
#   a person read the price on the provider's price page, or `unchecked`. Every
#   price here is `unchecked` and is a placeholder chosen to be high, so that the
#   broker counts more than a real bill would. `price_source` says where to read
#   the real figure.
#
# HOW TO READ A CEILING
#   `max_micro_usd` is millionths of a US dollar: 1000000 is one dollar.
#   `max_tokens` counts input and output tokens together.
#
# RULES THE LOADER CHECKS (a file that breaks one does not load)
#   * Every model has a provider that the broker knows (anthropic or openai), a
#     runtime, a family, a tier and four prices.
#   * Every role names models that exist, starts with one of them, and escalates
#     only to a model of a larger tier.
#   * Every route names a stage that has a role and models that the role may use.
#   * Every ceiling of a role is at or under the limit in the role's agent
#     manifest, every per-job ceiling is at or under the hard ceiling of
#     policies/security.yaml, and the per-request caps are at or under the
#     per-request caps there.
#   * Every independence rule names two roles, and for every model its author
#     role may use, at least one model its reviewer role may use differs from it
#     in the way the rule says.
#   * An operations role (section 6) has no stage and no route, and is not also
#     a pipeline role. It follows the rules of a role above, its run ceiling is
#     at or under its manifest's limits and its own day ceiling, its day
#     ceiling is at or under `budgets.hard_ceilings.per_org_day` of
#     policies/security.yaml, and no project may add one or raise its ceilings.
# =============================================================================

schema_version: 1

policy:
  id: model_routing
  version: 1
  status: enforced                    # enum: designed | enforced. Set by the owner's decision of 2026-11-13, after the prices were read.
  default_action: deny                # a model that a role does not list is refused
  conflict_resolution: deny_overrides
  project_overrides: tighten_only
  config_source: protected_default_branch
  threats: [T-05, T-20, T-26, T-27]

# -----------------------------------------------------------------------------
# 1. Models
# -----------------------------------------------------------------------------
# The three names below are the ones in the manifests. The family is the part of
# the name that says who trained it: two models of one family are the same kind
# of reviewer for the purpose of independence (section 4).
models:
  - id: claude-sonnet-5-5
    provider: anthropic
    runtime: claude-code-cli
    family: claude
    tier: standard
    prices: { input: 2000000, cache_write: 2500000, cache_read: 100000, output: 10000000 }
    price_checked_on: "2026-11-13"
    price_source: "Read on 2026-11-13 from the Anthropic price page, platform.claude.com/docs/en/about-claude/pricing (standard row; cache_write is the 5-minute write, because the broker refuses 1-hour cache writes)."
  - id: claude-opus-5-5
    provider: anthropic
    runtime: claude-code-cli
    family: claude
    tier: large
    prices: { input: 4000000, cache_write: 5000000, cache_read: 200000, output: 20000000 }
    price_checked_on: "2026-11-13"
    price_source: "Read on 2026-11-13 from the Anthropic price page, platform.claude.com/docs/en/about-claude/pricing (standard row; cache_write is the 5-minute write, because the broker refuses 1-hour cache writes)."
  - id: gpt-6.1-sol
    provider: openai
    runtime: codex-cli
    family: gpt
    tier: standard
    prices: { input: 2000000, cache_write: 2000000, cache_read: 100000, output: 10000000 }
    price_checked_on: "2026-11-13"
    price_source: "Read on 2026-11-13 from the OpenAI price page, developers.openai.com/api/docs/pricing (Standard, short context up to 272K input tokens). OpenAI has no separate cache write price, so it is priced as input."

# -----------------------------------------------------------------------------
# 2. Roles
# -----------------------------------------------------------------------------
# One entry for each agent role in agents/*/manifest.json. `allowed_models` is
# every model the role may ever use. `start_with` is the first attempt.
# `escalate_to` is used only after `escalate_after_failed_repairs` failed
# repairs, never as a first attempt (the notes of the manifests say the same).
#
# `per_stage_run` is the most one run of the stage may spend. `per_request` is
# the largest request the broker forwards for the role. All of them are lower
# than the limits in the manifests.
roles:
  - role: intake
    stage: INTAKE
    allowed_models: [claude-sonnet-5-5, claude-opus-5-5, gpt-6.1-sol]
    start_with: claude-sonnet-5-5
    escalate_to: claude-opus-5-5
    escalate_after_failed_repairs: 2
    per_stage_run: { max_micro_usd: 100000, max_tokens: 20000 }                 # PENDING CONFIRMATION ($0.10)
    per_request: { max_input_tokens: 15000, max_output_tokens: 2000 }            # PENDING CONFIRMATION
  - role: specification_writer
    stage: SPECIFICATION
    allowed_models: [claude-sonnet-5-5, claude-opus-5-5, gpt-6.1-sol]
    start_with: claude-sonnet-5-5
    escalate_to: claude-opus-5-5
    escalate_after_failed_repairs: 2
    per_stage_run: { max_micro_usd: 2000000, max_tokens: 150000 }               # PENDING CONFIRMATION ($2.00)
    per_request: { max_input_tokens: 100000, max_output_tokens: 16000 }          # PENDING CONFIRMATION
  - role: specification_reviewer
    stage: SPECIFICATION
    allowed_models: [claude-sonnet-5-5, claude-opus-5-5, gpt-6.1-sol]
    start_with: gpt-6.1-sol
    escalate_to: claude-opus-5-5
    escalate_after_failed_repairs: 2
    per_stage_run: { max_micro_usd: 750000, max_tokens: 60000 }                 # PENDING CONFIRMATION ($0.75)
    per_request: { max_input_tokens: 45000, max_output_tokens: 8000 }            # PENDING CONFIRMATION
  - role: architect
    stage: ARCHITECTURE
    allowed_models: [claude-sonnet-5-5, claude-opus-5-5, gpt-6.1-sol]
    start_with: claude-sonnet-5-5
    escalate_to: claude-opus-5-5
    escalate_after_failed_repairs: 2
    per_stage_run: { max_micro_usd: 2000000, max_tokens: 125000 }               # PENDING CONFIRMATION ($2.00)
    per_request: { max_input_tokens: 100000, max_output_tokens: 16000 }          # PENDING CONFIRMATION
  # The critic runs inside the architecture stage run, after the architect, only when the risk
  # tier of the design needs one. It is routed against the architect's model (section 4), as the
  # specification reviewer is against the writer's.
  - role: architecture_critic
    stage: ARCHITECTURE
    allowed_models: [claude-sonnet-5-5, claude-opus-5-5, gpt-6.1-sol]
    start_with: gpt-6.1-sol
    escalate_to: claude-opus-5-5
    escalate_after_failed_repairs: 2
    per_stage_run: { max_micro_usd: 1250000, max_tokens: 100000 }               # PENDING CONFIRMATION ($1.25)
    per_request: { max_input_tokens: 85000, max_output_tokens: 8000 }            # PENDING CONFIRMATION
  - role: planner
    stage: TASK_PLANNING
    allowed_models: [claude-sonnet-5-5, claude-opus-5-5, gpt-6.1-sol]
    start_with: claude-sonnet-5-5
    escalate_to: claude-opus-5-5
    escalate_after_failed_repairs: 2
    per_stage_run: { max_micro_usd: 1500000, max_tokens: 100000 }               # PENDING CONFIRMATION ($1.50)
    per_request: { max_input_tokens: 80000, max_output_tokens: 16000 }          # PENDING CONFIRMATION
  - role: builder
    stage: IMPLEMENTATION
    allowed_models: [claude-sonnet-5-5, claude-opus-5-5, gpt-6.1-sol]
    start_with: claude-sonnet-5-5
    escalate_to: claude-opus-5-5
    escalate_after_failed_repairs: 2
    per_stage_run: { max_micro_usd: 2500000, max_tokens: 200000 }               # PENDING CONFIRMATION ($2.50)
    per_request: { max_input_tokens: 150000, max_output_tokens: 16000 }          # PENDING CONFIRMATION
  - role: code_reviewer
    stage: REVIEW
    allowed_models: [claude-sonnet-5-5, claude-opus-5-5, gpt-6.1-sol]
    start_with: gpt-6.1-sol
    escalate_to: claude-opus-5-5
    escalate_after_failed_repairs: 2
    per_stage_run: { max_micro_usd: 1250000, max_tokens: 100000 }               # PENDING CONFIRMATION ($1.25)
    per_request: { max_input_tokens: 85000, max_output_tokens: 8000 }           # PENDING CONFIRMATION
  - role: technical_writer
    stage: DOCUMENTING
    allowed_models: [claude-sonnet-5-5, claude-opus-5-5, gpt-6.1-sol]
    start_with: claude-sonnet-5-5
    escalate_to: claude-opus-5-5
    escalate_after_failed_repairs: 2
    per_stage_run: { max_micro_usd: 750000, max_tokens: 75000 }                 # PENDING CONFIRMATION ($0.75)
    per_request: { max_input_tokens: 55000, max_output_tokens: 16000 }           # PENDING CONFIRMATION
  - role: documentation_reviewer
    stage: DOCUMENTATION_REVIEW
    allowed_models: [claude-sonnet-5-5, claude-opus-5-5, gpt-6.1-sol]
    start_with: gpt-6.1-sol
    escalate_to: claude-opus-5-5
    escalate_after_failed_repairs: 2
    per_stage_run: { max_micro_usd: 500000, max_tokens: 60000 }                 # PENDING CONFIRMATION ($0.50)
    per_request: { max_input_tokens: 50000, max_output_tokens: 8000 }            # PENDING CONFIRMATION

# -----------------------------------------------------------------------------
# 3. Routes
# -----------------------------------------------------------------------------
# For a stage and a tier, the models to try, in this order. The router never
# returns a model that is not listed here. The reviewing stages list the model
# of the other family first, so that the first choice is independent of a
# builder or a writer that started with the model of the first family
# (section 4). There is no `small` tier: the manifests name no small model.
routes:
  - { stage: INTAKE,               tier: standard, candidates: [claude-sonnet-5-5, gpt-6.1-sol] }
  - { stage: INTAKE,               tier: large,    candidates: [claude-opus-5-5] }
  - { stage: SPECIFICATION,        tier: standard, candidates: [claude-sonnet-5-5, gpt-6.1-sol] }
  - { stage: SPECIFICATION,        tier: large,    candidates: [claude-opus-5-5] }
  - { stage: ARCHITECTURE,         tier: standard, candidates: [claude-sonnet-5-5, gpt-6.1-sol] }
  - { stage: ARCHITECTURE,         tier: large,    candidates: [claude-opus-5-5] }
  - { stage: TASK_PLANNING,        tier: standard, candidates: [claude-sonnet-5-5, gpt-6.1-sol] }
  - { stage: TASK_PLANNING,        tier: large,    candidates: [claude-opus-5-5] }
  - { stage: IMPLEMENTATION,       tier: standard, candidates: [claude-sonnet-5-5, gpt-6.1-sol] }
  - { stage: IMPLEMENTATION,       tier: large,    candidates: [claude-opus-5-5] }
  - { stage: REVIEW,               tier: standard, candidates: [gpt-6.1-sol, claude-sonnet-5-5] }
  - { stage: REVIEW,               tier: large,    candidates: [claude-opus-5-5] }
  - { stage: DOCUMENTING,          tier: standard, candidates: [claude-sonnet-5-5, gpt-6.1-sol] }
  - { stage: DOCUMENTING,          tier: large,    candidates: [claude-opus-5-5] }
  - { stage: DOCUMENTATION_REVIEW, tier: standard, candidates: [gpt-6.1-sol, claude-sonnet-5-5] }
  - { stage: DOCUMENTATION_REVIEW, tier: large,    candidates: [claude-opus-5-5] }

# -----------------------------------------------------------------------------
# 4. Reviewer independence
# -----------------------------------------------------------------------------
# A reviewer must not be the same kind of model as the agent whose work it
# reviews. `must_differ_by` says how the two models must differ: `model` (not
# the same model), `family` (not of the same family) or `provider` (not from
# the same provider), from the weakest to the strongest. A project may make a
# rule stronger, never weaker.
#
# The owner chose `model` on 2026-11-13 (ADR 0020, amendment). In subscription
# mode only Claude runs, so no model of another family is available, and a
# reviewer of the same family but another model is the best the factory has:
# Claude Opus reviews what Claude Sonnet wrote, and the other way round. The
# router looks at the other tiers of the stage when the asked tier has no such
# model, because Opus is listed only at the large tier. With both providers
# served (api_key mode), the reviewing routes still list the model of the other
# family first, so the reviewer is of another family whenever one is served.
# A review by the same family is a weaker check than one by another family; the
# audit log and the evidence of the job say so each time it happens.
#
# When no allowed model differs, the reviewing stage does not run on the
# author's model; it waits for a person (`on_no_independent_model`), and a
# person cannot approve that wait in the reviewer's place.
independence:
  on_no_independent_model: wait_for_human
  rules:
    - { id: code_review_not_by_the_builders_model,         author_role: builder,              reviewer_role: code_reviewer,          must_differ_by: model }
    - { id: documentation_review_not_by_the_writers_model,  author_role: technical_writer,     reviewer_role: documentation_reviewer, must_differ_by: model }
    - { id: specification_review_not_by_the_writers_model,  author_role: specification_writer, reviewer_role: specification_reviewer, must_differ_by: model }
    - { id: architecture_critique_not_by_the_architects_model, author_role: architect,        reviewer_role: architecture_critic,    must_differ_by: model }

# -----------------------------------------------------------------------------
# 5. Job ceilings
# -----------------------------------------------------------------------------
# What all the stages of one job may spend together. Under the hard ceiling of
# policies/security.yaml (`budgets.hard_ceilings.per_job.max_usd`), which is 25
# dollars. A stage run is held to its own ceiling in section 2 first.
job:
  max_micro_usd: 10000000             # PENDING CONFIRMATION ($10.00)
  max_tokens: 1500000                 # PENDING CONFIRMATION

# -----------------------------------------------------------------------------
# 6. Operations roles
# -----------------------------------------------------------------------------
# Roles of agents that run outside the pipeline, in no job and no stage (ADR
# 0021). They have no route: a run starts with `start_with` and moves to
# `escalate_to` after `escalate_after_failed_repairs` failed repairs. Their
# spend is never charged to a job; it is held to `per_run` for one run and to
# `per_day` for all the runs of one UTC day together.
#
# The troubleshooter (ADR 0021, Decision 2). Claude only: Codex cannot be
# brokered in subscription mode (ADR 0020), so gpt-6.1-sol is not allowed.
#   per_run   0.75 dollars and 150000 tokens, under the manifest's 2 dollars and
#             200000 tokens. A Sonnet run was measured at 0.12 to 0.25 dollars,
#             so this is three times the worst measured run; an Opus run costs
#             twice as much per token and still fits most investigations.
#   per_day   3 dollars at list price. policies/troubleshooting.yaml allows at
#             most 8 agent runs a day; 8 Sonnet runs at the measured worst case
#             are 2 dollars, which leaves room for one or two escalations. Past
#             3 dollars the day's runs stop and probes keep running without
#             the model, so a flood costs at most 3 dollars a day (T-53 in ADR
#             0021). The owner may raise it after the first weeks of use.
operations_roles:
  - role: troubleshooter
    allowed_models: [claude-sonnet-5-5, claude-opus-5-5]
    start_with: claude-sonnet-5-5
    escalate_to: claude-opus-5-5
    escalate_after_failed_repairs: 2
    per_run: { max_micro_usd: 750000, max_tokens: 150000 }                      # PENDING CONFIRMATION ($0.75)
    per_request: { max_input_tokens: 100000, max_output_tokens: 8000 }           # PENDING CONFIRMATION
    per_day: { max_micro_usd: 3000000 }                                          # PENDING CONFIRMATION ($3.00 a day)
