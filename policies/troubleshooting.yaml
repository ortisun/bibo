# =============================================================================
# policies/troubleshooting.yaml  -  when the troubleshooter looks at the factory,
# what its MCP gateway allows, and the probes that start an investigation
# =============================================================================
# STATUS: DESIGNED (ADR 0021, accepted by the owner on 2026-11-20). No program
# reads this file yet: apps/troubleshooter and crates/mcp_gateway are built by
# other packages. The loader (crates/contracts/src/policy/troubleshooting.rs)
# already refuses a file that breaks a rule written at the end of this header.
#
# This file shares the parser contract of policies/security.yaml: YAML 1.2
# subset, no anchors or merge keys, no nulls, `deny_unknown_fields`, a
# `schema_version` check, tighten-only project overrides and a policy hash.
# Read the header of security.yaml first.
#
# WHAT READS THIS FILE
#   The troubleshooter runs every probe each `probe_period_s`, starts an agent
#   run when probes trip (and once each `sweep_period_s`), and holds itself to
#   the caps below. The MCP gateway offers the agent the tools of section 5 and
#   nothing else, and enforces the limits of section 3 on every call.
#
# WHAT IS NOT IN THIS FILE
#   * No key, no token and no address. The Datadog keys, the VictoriaMetrics
#     token and the database login are files named in the troubleshooter
#     configuration; the Datadog site and the server addresses are deployment
#     configuration.
#   * Who may hold a gateway tool. That is the tool table of
#     policies/security.yaml (`mcp.*` entries, role `troubleshooter`).
#   * What a run may spend. That is `operations_roles` in
#     policies/model_routing.yaml.
#
# RULES THE LOADER CHECKS (a file that breaks one does not load)
#   * Every number is positive and inside a sane cap: probe period 60 s to 1 h,
#     sweep 1 h to 7 days and never shorter than the probe period, cool-down
#     from the probe period to 7 days, exactly 1 concurrent agent run, 1 to 24
#     agent runs a day, 1 to 10 new issues a day, 1 comment per issue a day,
#     1 to 100 calls per run, 1 to 50 calls per 10 s (Datadog's fair-use limit
#     is 50), 1 KiB to 1 MiB per result, a call deadline of 1 to 60 s and never
#     longer than the run, a run of 60 s to 1 h, probe windows of 60 s to 7 days.
#   * No issue label is `factory`, `factory: ...` or `design: ...` (case and
#     spaces ignored): a finding never becomes factory work by its label.
#   * Datadog is asked for the `core` toolset only, and every notebook tool is
#     omitted; VictoriaMetrics disables `export` and every debug tool.
#   * Every gateway tool is `mcp.<upstream>.<name>`, offered as
#     `<prefix><name>` (datadog_, vm_, pg_), maps to exactly one upstream tool
#     that the narrowing does not remove, and is an entry of the tool table of
#     policies/security.yaml held by `troubleshooter` alone, with no sandbox
#     profile and limits at or above the gateway's.
#   * Every probe id is unique; a `sql_check` names a check of
#     pg_factory_health; an `http_health` probe names a route and compares an
#     HTTP status; a count is compared with a whole number.
# =============================================================================

schema_version: 1

policy:
  id: troubleshooting
  version: 1
  status: designed                    # enum: designed | enforced
  default_action: deny                # a gateway tool that is not listed is neither offered nor callable
  project_overrides: tighten_only
  config_source: protected_default_branch
  threats: [T-03, T-06, T-16, T-26, T-27, T-49, T-50, T-51, T-52, T-53, T-54]

# -----------------------------------------------------------------------------
# 1. Schedule (ADR 0021, Decision 2)
# -----------------------------------------------------------------------------
# Probes are cheap and run often; the agent runs only when a probe trips and on
# the slow sweep. A probe that tripped and was investigated waits for its
# cool-down before it can start another run, so a lasting problem costs one run
# per cool-down and not one per probe period.
schedule:
  probe_period_s: 300                 # 5 minutes
  sweep_period_s: 86400               # once a day
  probe_cooldown_s: 21600             # 6 hours
  max_concurrent_agent_runs: 1
  max_agent_runs_per_day: 8           # sweeps included; with the 3-dollar day ceiling of the role

# -----------------------------------------------------------------------------
# 2. Issues (ADR 0021, Decision 7)
# -----------------------------------------------------------------------------
# Code writes every issue and comment from a closed template; the agent never
# does. Past `max_new_per_day`, findings stay in the run record and are named in
# the next issue. A second finding with the same fingerprint while its issue is
# open adds at most `max_comments_per_issue_per_day` comments instead of an
# issue.
issues:
  max_new_per_day: 3
  max_comments_per_issue_per_day: 1
  labels: [troubleshooter, "troubleshooter: triage"]

# -----------------------------------------------------------------------------
# 3. Gateway limits (ADR 0021, Decision 3)
# -----------------------------------------------------------------------------
# Per agent run. Calls per 10 seconds stay under Datadog's fair-use limit of 50,
# with room for the probes that run beside the agent. A result over
# `max_result_bytes` is cut, and a marker says how much was cut. The calls per
# run and the wall clock match the troubleshooter manifest's limits (60 tool
# calls, 900 seconds).
gateway:
  max_calls_per_run: 60
  max_calls_per_10s: 40
  max_result_bytes: 65536             # 64 KiB
  call_deadline_s: 20
  run_wall_clock_s: 900

# -----------------------------------------------------------------------------
# 4. Upstream narrowing (ADR 0021, Decision 3)
# -----------------------------------------------------------------------------
# A second layer under the allowlist of section 5, because Datadog says its
# server is "under significant development". The Datadog URL carries
# `toolsets=core` and `omit_tools=` this list; the core toolset holds notebook
# tools that write. VictoriaMetrics starts with `MCP_DISABLED_TOOLS` set to this
# list. The PostgreSQL server is the factory's own and read only by its role.
upstreams:
  datadog:
    toolsets: [core]
    omit_tools:
      - create_datadog_notebook
      - create_datadog_notebook_v2
      - edit_datadog_notebook
      - edit_datadog_notebook_v2
      - append_datadog_notebook
      - replace_datadog_notebook_section
      - update_datadog_notebook_widget
      - delete_datadog_notebook
      - recover_datadog_notebook
  victoriametrics:
    disabled_tools:
      - export
      - flags
      - metric_relabel_debug
      - downsampling_filters_debug
      - retention_filters_debug
      - test_rules
      - metric_statistics
      - documentation                   # never offered by the gateway; disabling it saves ~690 MiB (measured 2026-11-20)

# -----------------------------------------------------------------------------
# 5. Gateway tools: the allowlist and its mapping
# -----------------------------------------------------------------------------
# `id` is the entry of the tool table of policies/security.yaml. `gateway_name`
# is what the agent sees (Claude Code renders it `mcp__factory__<gateway_name>`).
# `upstream_tool` is the one tool the gateway calls on `upstream`. `description`
# is what the model reads as the tool's description: the factory's words, never
# the upstream's, which reach the model outside the prompt's data delimiters
# (TR-7 of docs/reviews/troubleshooter-security-review.md). The Datadog
# and VictoriaMetrics names were read from their documentation on 2026-11-20
# and not called; the PostgreSQL names are those ADR 0021 gives crates/mcp_postgres.
tools:
  - id: mcp.datadog.search_logs
    gateway_name: datadog_search_logs
    upstream: datadog
    upstream_tool: search_datadog_logs
    description: "Search the factory's logs in Datadog by query and time range."
  - id: mcp.datadog.analyze_logs
    gateway_name: datadog_analyze_logs
    upstream: datadog
    upstream_tool: analyze_datadog_logs
    description: "Count and group the factory's logs in Datadog by fields over a time range."
  - id: mcp.datadog.get_trace
    gateway_name: datadog_get_trace
    upstream: datadog
    upstream_tool: get_datadog_trace
    description: "Read one trace from Datadog APM by its trace id."
  - id: mcp.datadog.search_spans
    gateway_name: datadog_search_spans
    upstream: datadog
    upstream_tool: search_datadog_spans
    description: "Search spans in Datadog APM by query and time range."
  - id: mcp.datadog.aggregate_spans
    gateway_name: datadog_aggregate_spans
    upstream: datadog
    upstream_tool: aggregate_spans
    description: "Count and group spans in Datadog APM over a time range."
  - id: mcp.datadog.get_metric
    gateway_name: datadog_get_metric
    upstream: datadog
    upstream_tool: get_datadog_metric
    description: "Read the values of one Datadog metric over a time range."
  - id: mcp.datadog.get_metric_context
    gateway_name: datadog_get_metric_context
    upstream: datadog
    upstream_tool: get_datadog_metric_context
    description: "Read the tags and metadata of one Datadog metric."
  - id: mcp.datadog.search_metrics
    gateway_name: datadog_search_metrics
    upstream: datadog
    upstream_tool: search_datadog_metrics
    description: "List the Datadog metric names that match a search."
  - id: mcp.datadog.search_monitors
    gateway_name: datadog_search_monitors
    upstream: datadog
    upstream_tool: search_datadog_monitors
    description: "List Datadog monitors and their states, filtered by a query or tags."
  - id: mcp.datadog.search_incidents
    gateway_name: datadog_search_incidents
    upstream: datadog
    upstream_tool: search_datadog_incidents
    description: "List Datadog incidents, filtered by a query or state."
  - id: mcp.datadog.get_incident
    gateway_name: datadog_get_incident
    upstream: datadog
    upstream_tool: get_datadog_incident
    description: "Read one Datadog incident by its id."
  - id: mcp.victoriametrics.query
    gateway_name: vm_query
    upstream: victoriametrics
    upstream_tool: query
    description: "Evaluate a PromQL or MetricsQL instant query against the factory's VictoriaMetrics."
  - id: mcp.victoriametrics.query_range
    gateway_name: vm_query_range
    upstream: victoriametrics
    upstream_tool: query_range
    description: "Evaluate a PromQL or MetricsQL range query against the factory's VictoriaMetrics."
  - id: mcp.victoriametrics.labels
    gateway_name: vm_labels
    upstream: victoriametrics
    upstream_tool: labels
    description: "List the label names VictoriaMetrics knows."
  - id: mcp.victoriametrics.label_values
    gateway_name: vm_label_values
    upstream: victoriametrics
    upstream_tool: label_values
    description: "List the values of one label in VictoriaMetrics."
  - id: mcp.victoriametrics.metrics
    gateway_name: vm_metrics
    upstream: victoriametrics
    upstream_tool: metrics
    description: "List the metric names VictoriaMetrics knows."
  - id: mcp.victoriametrics.metrics_metadata
    gateway_name: vm_metrics_metadata
    upstream: victoriametrics
    upstream_tool: metrics_metadata
    description: "Read the type and help text of VictoriaMetrics metrics."
  - id: mcp.victoriametrics.alerts
    gateway_name: vm_alerts
    upstream: victoriametrics
    upstream_tool: alerts
    description: "List the alerts that the VictoriaMetrics alerting rules have raised."
  - id: mcp.victoriametrics.active_queries
    gateway_name: vm_active_queries
    upstream: victoriametrics
    upstream_tool: active_queries
    description: "List the queries VictoriaMetrics is running now."
  - id: mcp.victoriametrics.explain_query
    gateway_name: vm_explain_query
    upstream: victoriametrics
    upstream_tool: explain_query
    description: "Explain how VictoriaMetrics would run a query, without running it."
  - id: mcp.postgres.list_relations
    gateway_name: pg_list_relations
    upstream: postgres
    upstream_tool: pg_list_relations
    description: "List the tables and views of a schema with their size, estimated rows and what this login may read."
  - id: mcp.postgres.describe_relation
    gateway_name: pg_describe_relation
    upstream: postgres
    upstream_tool: pg_describe_relation
    description: "Describe one table or view: its columns and types, which columns this login may read, and its indexes."
  - id: mcp.postgres.query
    gateway_name: pg_query
    upstream: postgres
    upstream_tool: pg_query
    description: "Run one read-only SQL query in a read-only transaction with a time limit; at most 200 rows and 64 KiB come back."
  - id: mcp.postgres.explain
    gateway_name: pg_explain
    upstream: postgres
    upstream_tool: pg_explain
    description: "Show the plan PostgreSQL would use for a SELECT, without running it (no ANALYZE)."
  - id: mcp.postgres.activity
    gateway_name: pg_activity
    upstream: postgres
    upstream_tool: pg_activity
    description: "List this database's sessions with their waits and transaction age; query texts have their literals replaced."
  - id: mcp.postgres.locks
    gateway_name: pg_locks
    upstream: postgres
    upstream_tool: pg_locks
    description: "Show each blocked session with the session blocking it, and the locks held and awaited by mode."
  - id: mcp.postgres.table_health
    gateway_name: pg_table_health
    upstream: postgres
    upstream_tool: pg_table_health
    description: "Per table: live and dead rows, scans, last vacuum and analyze, and size."
  - id: mcp.postgres.factory_health
    gateway_name: pg_factory_health
    upstream: postgres
    upstream_tool: pg_factory_health
    description: "The factory's health in one call: stuck jobs, expired leases, waits for a person, recent failures and the outbox backlog."

# -----------------------------------------------------------------------------
# 6. Probes (ADR 0021, Decision 2)
# -----------------------------------------------------------------------------
# A probe trips when `<observed> <comparator> <threshold>` holds. A probe that
# cannot run (its source is down) is itself a finding, `source_unavailable`,
# raised without the model.
#
# The metric names are those of docs/observability/conventions.md and
# crates/observability/src/metrics.rs. infra/otel/README.md records that
# VictoriaMetrics (started with -opentelemetry.usePrometheusNaming) returned
# all of them under their exact names, the histogram as _bucket, _count and
# _sum, so no suffix is added here. The PromQL expressions themselves have not
# been run against a VictoriaMetrics with real data: `checked_on: unchecked`.
#
# The window in a PromQL expression and `window_s` must agree; the loader does
# not parse PromQL, so a person keeps them together.
probes:
  - id: stage_failure_rate
    kind: promql_threshold
    description: "Share of stage runs that ended failed in the last hour, once at least four ended."
    query: 'sum(increase(factory_stage_runs_total{outcome="failed"}[1h])) / sum(increase(factory_stage_runs_total[1h])) and on() sum(increase(factory_stage_runs_total[1h])) >= 4'
    comparator: gt
    threshold: 0.25
    window_s: 3600
    severity: high
    checked_on: unchecked
  - id: gate_failures
    kind: promql_threshold
    description: "Gate evaluations that ended failed or blocked in the last hour. The metric counts failures only, so this is a count and not a rate."
    query: 'sum(increase(factory_gate_failures_total[1h]))'
    comparator: gt
    threshold: 10
    window_s: 3600
    severity: medium
    checked_on: unchecked
  - id: ready_queue_never_drains
    kind: promql_threshold
    description: "The queue of ready stage runs was never empty for 30 minutes. The gauge is capped at the claim batch, so it shows a backlog and not its size."
    query: 'max(min_over_time(factory_queue_depth{queue="ready_stage_runs"}[30m]))'
    comparator: ge
    threshold: 1
    window_s: 1800
    severity: medium
    checked_on: unchecked
  - id: retries
    kind: promql_threshold
    description: "Retries scheduled after a retryable attempt failure in the last hour."
    query: 'sum(increase(factory_retries_total[1h]))'
    comparator: gt
    threshold: 10
    window_s: 3600
    severity: medium
    checked_on: unchecked
  - id: day_spend_near_ceiling
    kind: promql_threshold
    description: "Model spend in the last 24 hours, against 80 percent of the per-repository day ceiling of 100 dollars in policies/security.yaml. The metric sums every repository, so the probe trips early rather than late."
    query: 'sum(increase(factory_spend_usd_total[24h]))'
    comparator: gt
    threshold: 80
    window_s: 86400
    severity: high
    checked_on: unchecked
  - id: leases_past_expiry
    kind: sql_check
    description: "Stage run leases still held after they expired."
    query: leases_past_expiry
    comparator: gt
    threshold: 0
    window_s: 300
    severity: high
    checked_on: unchecked
  - id: stage_runs_past_deadline
    kind: sql_check
    description: "Stage runs still running after their deadline."
    query: stage_runs_past_deadline
    comparator: gt
    threshold: 0
    window_s: 300
    severity: high
    checked_on: unchecked
  - id: human_waits_past_expiry
    kind: sql_check
    description: "Jobs waiting for a person past the expiry of the wait."
    query: human_waits_past_expiry
    comparator: gt
    threshold: 0
    window_s: 300
    severity: medium
    checked_on: unchecked
  - id: api_ready
    kind: http_health
    description: "The readiness route of the factory API does not answer 200."
    query: /readyz
    comparator: ne
    threshold: 200
    window_s: 300
    severity: high
    checked_on: unchecked
  - id: datadog_factory_monitors_alerting
    kind: datadog_monitors_alerting
    description: "Datadog monitors tagged with a factory service that are in Alert. Only with the Datadog overlay of infra/otel."
    query: 'status:alert tag:"service:factory-*"'
    comparator: gt
    threshold: 0
    window_s: 300
    severity: high
    checked_on: unchecked
